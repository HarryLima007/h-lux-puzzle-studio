<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c120a">
<title>H-LUX Wood Blocks</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
:root{--bg:#1c120a;--bg2:radial-gradient(ellipse at 50% 20%,#3a2414 0%,#1c120a 70%);--panel:#2a1b0f;--panel2:#352315;--line:#5a3c22;--text:#f4e7d3;--muted:#c4a988;--accent:#d9a45c;--accent2:#f0c98a;--btn:linear-gradient(180deg,#e2b46f,#a8702f);--btn-text:#1e1206;--c:32px;--t:17px}
body{touch-action:none}
.title{font-family:var(--serif)}
.stage{flex-direction:column;gap:12px;justify-content:center}
/* tabuleiro de madeira com veios */
.board{display:grid;gap:3px;padding:8px;border-radius:16px;flex:none;
  background:repeating-linear-gradient(92deg,rgba(0,0,0,.08) 0 2px,transparent 2px 9px),linear-gradient(180deg,#8a5a32,#6b4223);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.6)}
.board{--g:3px}
.bc{width:var(--c);height:var(--c);border-radius:6px;background:rgba(40,22,10,.55);box-shadow:inset 0 2px 4px rgba(0,0,0,.45)}
.bc.on{box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.4)}
.t0{background:repeating-linear-gradient(100deg,rgba(0,0,0,.07) 0 2px,transparent 2px 7px),linear-gradient(160deg,#f2d29b,#d9ab68)!important}   /* bordo */
.t1{background:repeating-linear-gradient(100deg,rgba(0,0,0,.1) 0 2px,transparent 2px 7px),linear-gradient(160deg,#b8743e,#8d4f22)!important}   /* cerejeira */
.t2{background:repeating-linear-gradient(100deg,rgba(0,0,0,.12) 0 2px,transparent 2px 7px),linear-gradient(160deg,#7a4c2b,#53301a)!important}   /* nogueira */
.t3{background:repeating-linear-gradient(100deg,rgba(0,0,0,.07) 0 2px,transparent 2px 7px),linear-gradient(160deg,#e9c27a,#c9963f)!important}   /* carvalho */
.t4{background:repeating-linear-gradient(100deg,rgba(0,0,0,.1) 0 2px,transparent 2px 7px),linear-gradient(160deg,#c9884f,#9b5d2a)!important}   /* teca */
.bc.pv{background:rgba(255,226,170,.55)}
.bc.pvx{background:rgba(200,60,40,.4)}
.bc.pz{outline:3px solid #ffe2a3;outline-offset:-3px}
.bc.clr{animation:clr .38s ease}
@keyframes clr{0%{filter:brightness(2);transform:scale(1) rotate(0)}100%{transform:scale(.3) rotate(25deg);opacity:.2}}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:calc(var(--c) * 10 + 43px);flex:none;touch-action:none}
.slot{height:calc(var(--t) * 5 + 16px);display:flex;align-items:center;justify-content:center;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.pc{display:grid;gap:2px;cursor:grab;touch-action:none}
.pc i{display:block;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.3)}
.pc.nofit{opacity:.4;filter:saturate(.3)}
.pc.float{position:fixed;left:0;top:0;z-index:50;pointer-events:none;gap:3px;filter:drop-shadow(0 12px 14px rgba(0,0,0,.5))}
.pc.float i{border-radius:6px}
.combo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:700;font-size:40px;color:#ffe2a3;text-shadow:0 2px 12px rgba(0,0,0,.7);pointer-events:none;animation:pop .9s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-90%)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><a class="back" href="../" data-platform-link><svg class="i"><path d="M14.5 6l-6 6 6 6"/></svg>H-LUX</a><div class="title">Wood <b>Blocks</b></div><button class="ib" id="menu" aria-label="Menu"><svg class="i"><path d="M4.5 7h15M4.5 12h15M4.5 17h15"/></svg></button></div>
  <div class="hud"><div class="sc"><small>Pontos</small><b id="score">0</b></div><div class="sc"><small>Recorde</small><b id="best">0</b></div><div class="sc"><small>Combo</small><b id="combo">—</b></div></div>
  <div class="stage" id="stage"><div class="board" id="board"></div><div class="tray" id="tray"></div></div>
</div>
<script src="../shared/kit.js"></script>
<script src="../shared/blockgrid.js"></script>
<script>
'use strict';
/* H-LUX WOOD BLOCKS v1.0 — 10×10: linhas e colunas eliminam. Peças de madeira com tons por formato. */
const G = HXBlockGrid.create({
  id: 'woodblocks', size: 10, boxes: 0,
  pieces: [
    { shape: '#', weight: 3, tone: 3 }, { shape: '##', weight: 4, tone: 0 }, { shape: '###', weight: 4, tone: 0 }, { shape: '####', weight: 3, tone: 4 }, { shape: '#####', weight: 2.5, tone: 4 },
    { shape: '##/##', weight: 4, tone: 1 }, { shape: '###/###/###', weight: 2, tone: 2 }, { shape: '##/#.', weight: 5, tone: 3 }, { shape: '###/#../#..', weight: 3, tone: 1 }
  ],
  // pontos: 1 por quadrado; linhas eliminadas valem 10, 30, 60, 100… e combos multiplicam
  score(n, lines, combo) { if (!lines) return n; return n + Math.round(10 * lines * (lines + 1) / 2 * (combo > 1 ? 1 + .5 * (combo - 1) : 1)); }
});
// o motor calcula o deslocamento do tabuleiro sem espaçamento; Wood usa espaçamento de 3px entre casas
const gap = 3;
const V = HXBlockGrid.mount(G, { board: HX.$('#board'), tray: HX.$('#tray'), stage: HX.$('#stage'), locked: () => HX.isOpen(), onPlace, onRender: hud });
function hud() { const s = G.s; HX.$('#score').textContent = s.score; HX.$('#best').textContent = Math.max(G.best(), s.score); HX.$('#combo').textContent = s.combo > 1 ? '×' + s.combo : '—'; }
function onPlace(r) {
  V.flash(r.cleared); V.render(); G.save();
  if (r.regions) { HX.vibrate(r.regions > 1 ? 30 : 15); const t = document.createElement('div'); t.className = 'combo'; t.textContent = (G.s.combo > 1 ? `Combo ×${G.s.combo}  ` : r.regions > 1 ? `${r.regions} linhas ` : '') + '+' + r.pts; HX.$('#stage').appendChild(t); setTimeout(() => t.remove(), 900); }
  if (G.s.over) setTimeout(over, 450);
}
function over() {
  const s = G.s, rec = G.finish();
  const c = HX.overlay(`<h3>Fim de jogo</h3><p>${rec ? '<b style="color:var(--accent2)">Novo recorde!</b>' : 'Nenhuma peça cabe mais.'}</p><div class="kv"><div><b>${s.score}</b><small>Pontos</small></div><div><b>${s.cleared}</b><small>Linhas</small></div><div><b>${G.best()}</b><small>Recorde</small></div></div><button class="btn-primary" id="new">Jogar de novo</button><button class="btn" id="home">Menu</button>`);
  HX.on(c, '#new', () => { HX.close(); start(true); }); HX.on(c, '#home', () => home());
}
function start(fresh) { G.s = fresh ? G.fresh() : (G.S.get('game', null) || G.fresh()); V.size(); hud(); G.save(); }
function home() {
  const saved = G.S.get('game', null), st = G.S.get('stats', { games: 0, cleared: 0 });
  G.s = saved || G.fresh(); V.size();
  const c = HX.overlay(`<h3>Wood Blocks</h3><p>Um tabuleiro de madeira 10×10. Complete linhas e colunas com as peças entalhadas.</p><div class="kv"><div><b>${G.best()}</b><small>Recorde</small></div><div><b>${st.games}</b><small>Partidas</small></div><div><b>${st.cleared}</b><small>Linhas</small></div></div>
    ${saved ? '<button class="btn-primary" id="cont">▶ Continuar</button>' : ''}<button class="${saved ? 'btn' : 'btn-primary'}" id="new">Nova partida</button><button class="btn" id="how">Como jogar</button>`, { guard: false });
  HX.on(c, '#cont', () => { HX.close(); start(false); }); HX.on(c, '#new', () => { HX.close(); start(true); }); HX.on(c, '#how', howTo);
}
function howTo() { HX.help('Como jogar', ['Arraste as peças de madeira para o tabuleiro 10×10.', 'Complete linhas ou colunas inteiras para eliminá-las. Várias de uma vez valem bem mais.', 'Elimine em jogadas seguidas para fazer <b>combos</b>.', 'As peças não giram. Planeje espaço para o bloco 3×3 e para as barras de 5!', 'A partida acaba quando nenhuma peça da bandeja couber.'], home); }
HX.$('#menu').onclick = () => {
  const c = HX.overlay(`<h3>Menu</h3><button class="btn-primary" id="go">Continuar</button><button class="btn" id="new">Nova partida</button><button class="btn" id="how">Como jogar</button>`, { guard: false, dismiss: () => {} });
  HX.on(c, '#go', () => HX.close()); HX.on(c, '#new', () => { HX.close(); if (G.s.placed) G.finish(); start(true); }); HX.on(c, '#how', () => HX.help('Como jogar', ['Arraste as peças para o tabuleiro.', 'Linhas e colunas completas são eliminadas.', 'As peças não giram.'], () => HX.close()));
};
HX.life({ onHide: () => G.s && G.save() });
home(); HX.sw();
window.WBK = { G, V };
</script>
</body>
</html>
