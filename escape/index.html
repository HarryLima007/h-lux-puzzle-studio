<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09070a">
<title>H-LUX Escape</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
:root{--bg:#09070a;--bg2:radial-gradient(ellipse at 50% 0%,#241a26 0%,#09070a 66%)}
#cv{display:block;touch-action:none;border-radius:14px;box-shadow:0 0 0 2px #c9a45c,0 20px 50px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none}
.esc{flex:1;width:100%;max-width:620px;align-self:center;display:flex;flex-direction:column;gap:8px;min-height:0}.scene{position:relative;flex:1;min-height:300px;border-radius:16px;border:1px solid var(--line);overflow:hidden}.ob{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--fg);font:700 10px Manrope,sans-serif;cursor:pointer;padding:4px;border-radius:12px;min-width:56px;min-height:56px}.ob .i{font-size:34px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}.ob span:last-child{background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px}.ob.done{opacity:.55}.ob:active{transform:translate(-50%,-50%) scale(.94)}.msg{border:1px solid var(--line);border-radius:12px;background:#131216;padding:8px 10px;font:600 13px Manrope,sans-serif;min-height:44px;color:var(--fg)}.inv{display:flex;gap:6px;min-height:58px;align-items:center}.inv b{font:700 11px Manrope,sans-serif;color:var(--muted)}.inv button{min-width:54px;min-height:54px;border-radius:12px;border:1px solid var(--line);background:#141416;font-size:26px}.inv button.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}.inv .hint{margin-left:auto;font-size:13px;padding:0 10px;color:var(--gold-2)}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.pad button{min-height:48px;font:800 18px Manrope,sans-serif}.disp{font:800 26px Manrope,sans-serif;letter-spacing:6px;text-align:center;padding:6px;border:1px solid var(--line);border-radius:10px;margin:6px 0}
</style>
</head>
<body>
<div class="app">
  <div class="top"><a class="back" href="../" data-platform-link><svg class="i"><path d="M14.5 6l-6 6 6 6"/></svg>H-LUX</a><div class="title">Esca<b>pe</b></div><button class="ib" id="menu" aria-label="Menu"><svg class="i"><path d="M9 6v12M15 6v12"/></svg></button></div>
  <div class="hud"><div class="sc"><small>Sala</small><b id="room">1/3</b></div><div class="sc"><small>Tempo</small><b id="tm">0:00</b></div><div class="sc"><small>Dicas</small><b id="hints">3</b></div></div>
  <div class="esc"><div class="scene" id="scene"></div><div class="msg" id="msg"></div><div class="inv" id="inv"></div></div>
</div>
<script src="../shared/kit.js"></script><script src="../shared/arcade.js"></script>
<script>
'use strict';
/* H-LUX ESCAPE v1.0 — 3 salas de fuga com objetos interativos, inventário e enigmas com solução coerente:
   Escritório (cofre com o ano do diploma, chave no vaso, cartão na porta), Laboratório (relógio parado → cadeado,
   lanterna UV revela a regra, frascos por pH → teclado de cores) e Cripta (símbolos das estátuas abrem o baú,
   tocha revela a inscrição, pé-de-cabra no sarcófago, ídolo para o guardião). Selecione um item e toque num objeto para usá-lo.
   Dicas limitadas (cada uma soma 60 s), recorde de tempo por sala. Módulos: ROOMS · Game · UI */
const S = HX.store('escape');
const say = s => UI.say(s);
const ROOMS = [
  { n: 'Escritório', bg: 'linear-gradient(#3a2a1e 0 62%,#5a3a22 62%)', hints: ['O diploma na parede mostra um ano importante.', 'Algo pequeno pode estar escondido na terra do vaso.', 'O cofre atrás do quadro usa o ano de fundação (4 dígitos). O cartão abre a porta.'],
    obj: [
      { id: 'diploma', ic: '📜', l: 'Diploma', x: 22, y: 22, tap: s => say('“H-LUX Investimentos — fundada em 1987.”') },
      { id: 'quadro', ic: '🖼️', l: 'Quadro', x: 55, y: 20, tap: s => { if (!s.quadro) { s.quadro = 1; say('Você tira o quadro da parede: há um cofre embutido atrás!'); } else UI.code('Cofre', 4, '1987', () => { s.cofre = 1; UI.give('cartao'); say('O cofre abriu! Dentro há um cartão de acesso.'); }, s.cofre); }, ic2: s => s.quadro ? '🔒' : '🖼️', l2: s => s.quadro ? (s.cofre ? 'Cofre (aberto)' : 'Cofre') : 'Quadro' },
      { id: 'vaso', ic: '🪴', l: 'Vaso', x: 85, y: 55, tap: s => { if (!s.chave) { s.chave = 1; UI.give('chave'); say('Cavando na terra do vaso, você encontra uma chave pequena.'); } else say('Só terra e raízes.'); } },
      { id: 'mesa', ic: '🗄️', l: 'Gaveta', x: 40, y: 70, tap: s => say(s.gaveta ? 'Gaveta aberta e vazia.' : 'A gaveta está trancada. Tem uma fechadura pequena.'), use: { chave: s => { s.gaveta = 1; UI.take('chave'); UI.give('bilhete'); say('A chave serviu! Na gaveta há um bilhete.'); } } },
      { id: 'janela', ic: '🪟', l: 'Janela', x: 82, y: 22, tap: s => say('Gradeada. Lá fora está escurecendo.') },
      { id: 'porta', ic: '🚪', l: 'Porta', x: 12, y: 62, tap: s => say('Trancada. Ao lado há um leitor de cartão.'), use: { cartao: s => UI.win() } }
    ], items: { chave: ['🗝️', 'Chave pequena'], bilhete: ['📝', 'Bilhete: “A senha é o ano em que tudo começou.”'], cartao: ['💳', 'Cartão de acesso'] } },
  { n: 'Laboratório', bg: 'linear-gradient(#1e2e34 0 60%,#2a3a40 60%)', hints: ['O relógio parou num horário — 3 números.', 'A lanterna do armário revela algo escrito no quadro branco.', 'Ordene os frascos pelo pH, do menor para o maior: vermelho (2), azul (5), amarelo (7), verde (9).'],
    obj: [
      { id: 'relogio', ic: '🕰️', l: 'Relógio', x: 18, y: 18, tap: s => say('O relógio está parado marcando 7:42.') },
      { id: 'armario', ic: '🗃️', l: 'Armário', x: 82, y: 55, tap: s => s.arm ? say('Armário aberto e vazio.') : UI.code('Cadeado (3 dígitos)', 3, '742', () => { s.arm = 1; UI.give('uv'); say('Clique! Dentro há uma lanterna de luz ultravioleta.'); }), note: 'Post-it no armário: “quando o tempo parou”.' },
      { id: 'postit', ic: '🟨', l: 'Post-it', x: 82, y: 35, tap: s => say('Post-it: “O código é o momento em que o tempo parou.”') },
      { id: 'quadro', ic: '⬜', l: 'Quadro branco', x: 50, y: 20, tap: s => say(s.uv ? 'Sob a luz UV: “ABRA NA ORDEM DO pH, DO MAIS ÁCIDO AO MAIS BÁSICO.”' : 'Parece em branco… mas há marcas estranhas.'), use: { uv: s => { s.uv = 1; say('Sob a luz UV aparece: “ABRA NA ORDEM DO pH, DO MAIS ÁCIDO AO MAIS BÁSICO.”'); } } },
      { id: 'frascos', ic: '⚗️', l: 'Frascos', x: 30, y: 52, tap: s => say('Quatro frascos com etiquetas: vermelho pH 2 · verde pH 9 · azul pH 5 · amarelo pH 7.') },
      { id: 'porta', ic: '🚪', l: 'Porta (teclado de cores)', x: 60, y: 66, tap: s => UI.colors(['🔴', '🔵', '🟡', '🟢'], ['🟢', '🔵', '🔴', '🟡']) }
    ], items: { uv: ['🔦', 'Lanterna UV'] } },
  { n: 'Cripta', bg: 'linear-gradient(#1a1614 0 58%,#2a2420 58%)', hints: ['As três estátuas têm símbolos gravados, da esquerda para a direita.', 'O baú guarda ferramentas. A tocha precisa de fogo.', 'Abra o sarcófago com o pé-de-cabra e entregue o ídolo ao guardião.'],
    obj: [
      { id: 'est1', ic: '🗿', l: 'Estátua', x: 14, y: 26, tap: s => say('Uma estátua com um ☀️ gravado no peito.') },
      { id: 'est2', ic: '🗿', l: 'Estátua', x: 36, y: 18, tap: s => say('Uma estátua com uma 🌙 gravada no peito.') },
      { id: 'est3', ic: '🗿', l: 'Estátua', x: 60, y: 26, tap: s => say('Uma estátua com uma ⭐ gravada no peito.') },
      { id: 'bau', ic: '🧰', l: 'Baú', x: 22, y: 64, tap: s => s.bau ? say('Baú aberto e vazio.') : UI.symbols(['☀️', '🌙', '⭐', '🔥', '💧'], ['☀️', '🌙', '⭐'], () => { s.bau = 1; UI.give('fosforo'); UI.give('pe'); say('O baú abriu: fósforos e um pé-de-cabra!'); }) },
      { id: 'tocha', ic: '🪔', l: 'Tocha', x: 84, y: 20, tap: s => say(s.fogo ? 'A tocha ilumina uma inscrição: “Ofereça ouro ao guardião e o portão se abrirá.”' : 'Uma tocha apagada. Há algo escrito na parede, mas está escuro.'), use: { fosforo: s => { s.fogo = 1; UI.take('fosforo'); say('A tocha acende e revela: “Ofereça ouro ao guardião e o portão se abrirá.”'); } } },
      { id: 'sarc', ic: '⚰️', l: 'Sarcófago', x: 52, y: 64, tap: s => say(s.sarc ? 'Vazio agora.' : 'Uma tampa de pedra pesada. Precisa de uma alavanca.'), use: { pe: s => { if (s.sarc) return; s.sarc = 1; UI.give('idolo'); say('Você força a tampa: dentro há um ídolo de ouro.'); } } },
      { id: 'guardiao', ic: '🛡️', l: 'Guardião', x: 84, y: 60, tap: s => say('Uma estátua de guardião com as mãos estendidas. Atrás dela, um portão de ferro.'), use: { idolo: s => UI.win() } }
    ], items: { fosforo: ['🔥', 'Fósforos'], pe: ['🪛', 'Pé-de-cabra'], idolo: ['🏺', 'Ídolo de ouro'] } }
];
const Game = { ri: 0, s: {}, inv: [], sel: null, t: 0, hints: 3, hintUsed: 0, state: 'idle',
  start(ri) { HX.close(); this.ri = ri; this.s = {}; this.inv = []; this.sel = null; this.t = 0; this.hints = 3; this.hintUsed = 0; this.state = 'play'; UI.render(); say(`Sala ${ri + 1}: ${ROOMS[ri].n}. Toque nos objetos para examinar.`); } };
const UI = {
  say(s) { HX.$('#msg').textContent = s; },
  give(k) { if (!Game.inv.includes(k)) Game.inv.push(k); HX.sfx('coin'); this.render(); },
  take(k) { Game.inv = Game.inv.filter(x => x !== k); if (Game.sel === k) Game.sel = null; this.render(); },
  render() { const R = ROOMS[Game.ri], s = Game.s; HX.$('#scene').style.background = R.bg;
    HX.$('#scene').innerHTML = R.obj.map(o => `<button class="ob" data-o="${o.id}" style="left:${o.x}%;top:${o.y}%"><span class="i">${o.ic2 ? o.ic2(s) : o.ic}</span><span>${o.l2 ? o.l2(s) : o.l}</span></button>`).join('');
    HX.$('#inv').innerHTML = `<b>Itens</b>${Game.inv.map(k => `<button data-k="${k}" class="${Game.sel === k ? 'sel' : ''}" title="${R.items[k][1]}">${R.items[k][0]}</button>`).join('') || '<small style="color:var(--muted);font-size:12px">vazio</small>'}<button class="btn hint" id="hint">💡 Dica (${Game.hints})</button>`; this.hud(); },
  hud() { HX.$('#room').textContent = `${Game.ri + 1}/3`; HX.$('#tm').textContent = HX.fmt((Game.t + Game.hintUsed * 60) * 1000); HX.$('#hints').textContent = Game.hints; },
  tapObj(id) { if (Game.state !== 'play') return; const R = ROOMS[Game.ri], o = R.obj.find(x => x.id === id), s = Game.s; HX.sfx('tap');
    if (Game.sel) { const k = Game.sel; Game.sel = null; if (o.use && o.use[k]) { o.use[k](s); } else say(`Usar ${R.items[k][1].split(':')[0].toLowerCase()} aqui não adianta.`); this.render(); return; }
    o.tap(s); this.render(); },
  tapItem(k) { const R = ROOMS[Game.ri]; if (Game.sel === k) { Game.sel = null; say(R.items[k][1]); } else { Game.sel = k; say(`${R.items[k][1].split(':')[0]} selecionado(a). Toque num objeto para usar. (Toque de novo para examinar.)`); } this.render(); },
  hint() { if (Game.hints <= 0) return HX.toast('Sem dicas restantes'); const R = ROOMS[Game.ri], i = 3 - Game.hints; Game.hints--; Game.hintUsed++; say('💡 ' + R.hints[i] + ' (+60 s)'); this.render(); },
  code(title, len, ans, ok, done) { if (done) return say('Já está aberto.'); let v = ''; const c = HX.overlay(`<h3>${title}</h3><div class="disp" id="d">${'·'.repeat(len)}</div><div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, 'OK'].map(k => `<button class="btn" data-k="${k}">${k}</button>`).join('')}</div><button class="btn" id="x">Fechar</button>`, { guard: false });
    const upd = () => c.querySelector('#d').textContent = (v + '·'.repeat(len)).slice(0, len);
    c.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; if (k === '⌫') v = v.slice(0, -1); else if (k === 'OK') { if (v === ans) { HX.close(); HX.sfx('win'); ok(); this.render(); } else { HX.sfx('lose'); HX.vibrate(40); v = ''; c.querySelector('#d').textContent = 'ERRO'; return setTimeout(upd, 600); } } else if (v.length < len) v += k; upd(); }); HX.on(c, '#x', () => HX.close()); },
  colors(opts, labels) { let seq = []; const c = HX.overlay(`<h3>Teclado de cores</h3><p>Pressione 4 cores na ordem certa.</p><div class="disp" id="d">····</div><div class="pad" style="grid-template-columns:repeat(4,1fr)">${opts.map(o => `<button class="btn" data-c="${o}" style="font-size:26px">${o}</button>`).join('')}</div><button class="btn" id="x">Fechar</button>`, { guard: false });
    c.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { seq.push(b.dataset.c); HX.sfx('tap'); c.querySelector('#d').textContent = (seq.join('') + '····').slice(0, Math.max(4, seq.join('').length)); if (seq.length === 4) { if (seq.join() === ['🔴', '🔵', '🟡', '🟢'].join()) { HX.close(); this.win(); } else { HX.sfx('lose'); HX.vibrate(40); seq = []; c.querySelector('#d').textContent = 'ERRO'; } } }); HX.on(c, '#x', () => HX.close()); },
  symbols(opts, ans, ok) { const cur = [0, 0, 0]; const c = HX.overlay(`<h3>Fechadura de símbolos</h3><p>Gire os três discos (toque para trocar).</p><div style="display:flex;gap:10px;justify-content:center;margin:10px 0">${cur.map((_, i) => `<button class="btn" data-d="${i}" style="font-size:34px;min-width:70px;min-height:70px">${opts[0]}</button>`).join('')}</div><button class="btn-primary" id="try">Abrir</button><button class="btn" id="x" style="margin-top:6px">Fechar</button>`, { guard: false });
    c.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const i = +b.dataset.d; cur[i] = (cur[i] + 1) % opts.length; b.textContent = opts[cur[i]]; HX.sfx('tap'); });
    HX.on(c, '#try', () => { if (cur.map(i => opts[i]).join() === ans.join()) { HX.close(); HX.sfx('win'); ok(); this.render(); } else { HX.sfx('lose'); HX.vibrate(40); HX.toast('Não abriu', 700); } }); HX.on(c, '#x', () => HX.close()); },
  win() { Game.state = 'won'; const total = Math.round(Game.t + Game.hintUsed * 60); HX.sfx('win'); const best = S.get('best', {}); const rec = !best[Game.ri] || total < best[Game.ri]; if (rec) { best[Game.ri] = total; S.set('best', best); } if (S.get('unlocked', 1) < Game.ri + 2) S.set('unlocked', Math.min(3, Game.ri + 2));
    S.hub(`${Object.keys(best).length}/3 salas escapadas`); HXA.menu({ title: 'Você escapou!', text: `${ROOMS[Game.ri].n} em ${HX.fmt(total * 1000)}${Game.hintUsed ? ` (com ${Game.hintUsed} dica${Game.hintUsed > 1 ? 's' : ''})` : ''}${rec ? ' · recorde!' : ''}`, primary: Game.ri < 2 ? ['Próxima sala', () => Game.start(Game.ri + 1)] : ['Escolher sala', () => this.home()], buttons: [['Salas', () => this.home()]] }); },
  init() {
    HX.$('#scene').addEventListener('click', e => { const b = e.target.closest('[data-o]'); if (b) this.tapObj(b.dataset.o); });
    HX.$('#inv').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) this.tapItem(b.dataset.k); else if (e.target.closest('#hint')) this.hint(); });
    HX.$('#menu').onclick = () => this.pause(); addEventListener('keydown', e => { if (e.key === 'p' || e.key === 'Escape') this.pause(); });
    setInterval(() => { if (Game.state === 'play' && !document.hidden) { Game.t += .25; if (Math.round(Game.t * 4) % 4 === 0) this.hud(); } }, 250);
    this.home();
  },
  help: ['Toque nos objetos para examiná-los. Itens encontrados vão para a barra de baixo.', 'Para usar um item, toque nele (fica destacado) e depois toque no objeto onde quer usá-lo. Tocar no item de novo mostra a descrição.', 'Cada sala tem uma solução lógica a partir das pistas da própria sala. Dicas: 3 por sala, cada uma soma 60 s ao tempo.', 'Escape das três salas: Escritório, Laboratório e Cripta.'],
  home() { const un = S.get('unlocked', 1), best = S.get('best', {}); HXA.menu({ title: 'Escape', text: 'Escolha uma sala.', html: `<div style="display:grid;gap:6px;margin:8px 0">${ROOMS.map((R, i) => `<button class="btn" data-r="${i}" ${i >= un ? 'disabled' : ''} style="display:flex;justify-content:space-between;padding:10px 14px"><span>${i >= un ? '🔒 ' : ''}${i + 1}. ${R.n}</span><small>${best[i] ? HX.fmt(best[i] * 1000) : '—'}</small></button>`).join('')}</div>`, help: this.help });
    document.querySelectorAll('.hx-card [data-r]').forEach(b => b.onclick = () => Game.start(+b.dataset.r)); },
  pause() { if (Game.state !== 'play') return this.home(); Game.state = 'pause'; HXA.menu({ title: 'Pausa', text: `${ROOMS[Game.ri].n} · ${HX.fmt(Game.t * 1000)}`, primary: ['Continuar', () => { Game.state = 'play'; }], buttons: [['Recomeçar sala', () => Game.start(Game.ri)], ['Salas', () => this.home()]] }); }
};
UI.init(); HX.sw();
window.EC = { Game, UI, S, ROOMS };

</script>
</body>
</html>
