const Game = {
  state: 'idle', mi: 0, M: null, grid: null, W: 0, H: 0, p: null, ents: [], coins: 0, gems: 0, cp: null, boss: null, t: 0, fx: [], shots: [],
  start(mi) {

  spawn() { this.p = { x: this.cp[0], y: this.cp[1], vx: 0, vy: 0, w: 20, h: 28, face: 1, ground: false, jumps: 0, inv: 1, atk: 0, atkCd: 0, held: false }; },
  solid(tx, ty, dy) { if (tx < 0 || tx >= this.W) return true; if (ty < 0) return false; if (ty >= this.H) return false; const ch = this.grid[ty][tx]; return ch === '#' || ch === 'B' || (ch === '=' && dy); },
  tileAt(px, py) { const tx = Math.floor(px / TS), ty = Math.floor(py / TS); return ty >= 0 && ty < this.H && tx >= 0 && tx < this.W ? this.grid[ty][tx] : ' '; },
  /* colisão AABB contra os blocos, eixo por eixo */
  move(o, dt) {

    const py = o.y; o.y += o.vy * dt; o.ground = false; l = Math.floor((o.x - o.w / 2) / TS); r = Math.floor((o.x + o.w / 2 - .01) / TS); t = Math.floor((o.y - o.h / 2) / TS); b = Math.floor((o.y + o.h / 2 - .01) / TS);
    for (let tx = l; tx <= r; tx++) { if (o.vy > 0) { const plat = this.tileAt(tx * TS + 1, b * TS + 1) === '=' ; const prevB = Math.floor((py + o.h / 2 - .01) / TS); if (this.solid(tx, b, true) && (!plat || prevB < b) && !(plat && o.drop)) { o.y = b * TS - o.h / 2; o.vy = 0; o.ground = true; } } if (o.vy < 0 && this.solid(tx, t, false)) { o.y = (t + 1) * TS + o.h / 2; o.vy = 0; } }
  },
  hurt(src) { const P = this.p; if (P.inv > 0) return; this.hp--; P.inv = 1.2; P.vy = -380; P.vx = (P.x < src ? -1 : 1) * 220; HX.sfx('hit'); HX.vibrate(40); UI.hud(); if (this.hp <= 0) this.die(); },
  die() { HX.sfx('lose'); this.lives = (this.lives || 0) + 1; this.hp = 3; this.spawn(); if (this.boss) { this.boss.hp = this.boss.hpMax; this.ents = this.ents.filter(e => e.k !== 'slime' || !e.minion); this.shots = []; } HX.toast('Voltou ao checkpoint', 900); UI.hud(); },
  step(dt) {

    P.vx += ((inp.x * SPD) - P.vx) * Math.min(1, dt * (P.ground ? 14 : 7)); if (inp.x) P.face = inp.x; P.drop = inp.down;

    if (!inp.jump && P.vy < -200) P.vy += G0 * dt * 1.2; P.vy = Math.min(900, P.vy + G0 * dt);

    if (inp.attack && P.atkCd <= 0) { P.atk = .18; P.atkCd = .35; HX.sfx('shot'); const ax = P.x + P.face * 26, ay = P.y; const tx = Math.floor(ax / TS), ty = Math.floor(ay / TS); for (const dy of [-1, 0]) if (this.grid[ty + dy] && this.grid[ty + dy][tx] === 'B') { this.grid[ty + dy][tx] = ' '; HX.sfx('boom'); this.fx.push({ k: 'dust', x: tx * TS + 16, y: (ty + dy) * TS + 16, t: .4 }); } }
    // perigos do mapa
    const feet = this.tileAt(P.x, P.y + P.h / 2 - 2), body = this.tileAt(P.x, P.y); if (feet === '^') this.hurt(P.x - P.face); if (feet === '~' || body === '~' || P.y > this.H * TS + 40) { this.hp = Math.max(0, this.hp - 1); UI.hud(); if (this.hp <= 0) return this.die(); this.spawn(); HX.sfx('lose'); }
    // entidades
    const box = (a, b) => Math.abs(a.x - b.x) < (a.w + (b.w || 20)) / 2 && Math.abs(a.y - b.y) < (a.h + (b.h || 20)) / 2;
    const atkBox = P.atk > 0 ? { x: P.x + P.face * 24, y: P.y, w: 34, h: 30 } : null;
    for (const e of this.ents) { if (e.dead) continue;
      if (e.k === 'slime') { e.vy = (e.vy || 0) + G0 * dt; const ahead = Math.floor((e.x + Math.sign(e.vx) * 14) / TS), below = Math.floor((e.y + e.h / 2 + 4) / TS); e.hitWall = 0; this.move(e, dt); if (e.hitWall || (e.ground && !this.solid(ahead, below, true))) e.vx = -e.vx || 50; }
      if (e.k === 'bat') { e.t += dt; e.x += e.vx * dt; e.y = e.y0 + Math.sin(e.t * 2.5) * 30; const tx = Math.floor((e.x + Math.sign(e.vx) * 14) / TS), ty = Math.floor(e.y / TS); if (this.solid(tx, ty, false) || Math.abs(e.x - (e.x0 ??= e.x)) > 140) e.vx = -e.vx; }
      if ((e.k === 'slime' || e.k === 'bat')) { if (atkBox && box(atkBox, e)) { e.hp--; e.x += P.face * 12; HX.sfx('hit'); if (e.hp <= 0) { e.dead = true; this.fx.push({ k: 'dust', x: e.x, y: e.y, t: .4 }); } }
        else if (box(P, e)) { if (P.vy > 120 && P.y < e.y - 6) { e.dead = true; P.vy = -420; HX.sfx('boom'); } else this.hurt(e.x); } }
      if (e.k === 'coin' && box(P, { x: e.x, y: e.y, w: 16, h: 16 })) { e.dead = true; this.coinsLv++; HX.sfx('coin'); }
      if (e.k === 'gem' && box(P, { x: e.x, y: e.y, w: 18, h: 18 })) { e.dead = true; this.gemsLv++; HX.sfx('power'); HX.toast(`Gema ${this.gemsLv}/${this.gemTotal}!`, 800); UI.hud(); }
      if (e.k === 'heart' && box(P, { x: e.x, y: e.y, w: 18, h: 18 })) { e.dead = true; this.hp = Math.min(5, this.hp + 1); HX.sfx('power'); UI.hud(); }

  bossStep(dt, atkBox, box) {

  },
  bossDown() { HX.sfx('win'); HX.toast(`${this.boss.n} derrotado!`, 1500); this.ents.push({ k: 'door', x: this.boss.x, y: (this.H - 3) * TS + 16 }); this.boss.hp = 0; this.bossDead = true; const b = S.get('beaten', 0); if (this.M.boss + 1 > b) S.set('beaten', this.M.boss + 1); if (this.M.boss === 0) HX.toast('Você aprendeu o PULO DUPLO!', 2500); },

const St = HXA.stage(VW, VH);

  draw() {
