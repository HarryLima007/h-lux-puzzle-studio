<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>H-LUX Four</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
:root{--bg:#070b16;--bg2:radial-gradient(ellipse at 50% 0%,#14213f 0%,#070b16 62%);--c:46px}
.frame{position:relative;padding:10px;border-radius:20px;background:linear-gradient(180deg,#1f3466,#152548);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 0 0 3px #c9a45c,0 22px 50px rgba(0,0,0,.6);touch-action:none}
.grid{display:grid;grid-template-columns:repeat(7,var(--c));grid-template-rows:repeat(6,var(--c));gap:4px;position:relative}
.cell{border-radius:50%;background:#070b16;box-shadow:inset 0 3px 6px rgba(0,0,0,.8);position:relative;overflow:visible}
.disc{position:absolute;inset:3px;border-radius:50%;transition:transform .32s cubic-bezier(.4,1.4,.6,1)}
.disc.A{background:radial-gradient(circle at 35% 30%,#ffe9a8,#e0b14a 55%,#9c7424);box-shadow:inset 0 0 0 4px rgba(255,255,255,.12),0 2px 3px rgba(0,0,0,.5)}
.disc.B{background:radial-gradient(circle at 35% 30%,#ff8f8f,#d63a3a 55%,#7d1414);box-shadow:inset 0 0 0 4px rgba(255,255,255,.12),0 2px 3px rgba(0,0,0,.5)}
.disc.win{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 3px #fff,0 0 22px #fff6c8}}
.cols{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(7,var(--c));gap:4px}
.col{border-radius:12px;cursor:pointer}
.col.hov{background:rgba(255,255,255,.07)}
.last::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:rgba(255,255,255,.85)}
.ghostrow{display:grid;grid-template-columns:repeat(7,var(--c));gap:4px;padding:0 10px;height:calc(var(--c) * .8);margin-bottom:4px}
.ghostrow div{border-radius:50%;opacity:0;transition:opacity .15s}
.ghostrow div.on{opacity:.55}
.wrap{display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>
<div class="app">
  <div class="top"><a class="back" href="../" data-platform-link><svg class="i"><path d="M14.5 6l-6 6 6 6"/></svg>H-LUX</a><div class="title">Fo<b>ur</b></div><button class="ib" id="menu" aria-label="Menu"><svg class="i"><path d="M4.5 7h15M4.5 12h15M4.5 17h15"/></svg></button></div>
  <div class="turnbar"><div class="pl" id="p-A"><span class="dot" style="background:#e0b14a"></span><span class="nm" id="n-A">Ouro</span><span class="ct" id="s-A">0</span></div><div class="pl" id="p-B"><span class="dot" style="background:#d63a3a"></span><span class="nm" id="n-B">Rubi</span><span class="ct" id="s-B">0</span></div></div>
  <div class="stage" id="stage"><div class="wrap"><div class="ghostrow" id="ghost"></div><div class="frame" id="frame"><div class="grid" id="grid"></div><div class="cols" id="cols"></div></div></div></div>
  <div class="tools">
    <button class="tool" id="t-undo"><svg class="i"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h9.5a5 5 0 0 1 0 10H11"/></svg>Desfazer</button>
    <button class="tool" id="t-hist"><svg class="i"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Histórico</button>
    <button class="tool" id="t-restart"><svg class="i"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4h4"/></svg>Reiniciar</button>
    <button class="tool" id="t-new"><svg class="i"><path d="M12 5v14M5 12h14"/></svg>Nova</button>
  </div>
</div>
<script src="../shared/kit.js"></script>
<script>
'use strict';
/* H-LUX FOUR v1.0 — conecte quatro peças (7 colunas × 6 linhas). 'A' ouro começa, 'B' rubi.
   Módulos: Rules (puras) · AI (negamax alfa-beta) · Game · View · UI */
const S = HX.store('four');
const W = 7, H = 6;
const Rules = {
  empty() { return Array(W * H).fill(''); },
  row(b, c) { for (let r = H - 1; r >= 0; r--) if (!b[r * W + c]) return r; return -1; },
  drop(b, c, p) { const r = this.row(b, c); if (r < 0) return null; const n = b.slice(); n[r * W + c] = p; return { b: n, i: r * W + c }; },
  line(b, i) { // devolve as casas de uma linha de 4+ que passa por i
    const p = b[i], r = Math.floor(i / W), c = i % W;
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const cells = [i];
      for (const s of [1, -1]) { let rr = r + dr * s, cc = c + dc * s; while (rr >= 0 && rr < H && cc >= 0 && cc < W && b[rr * W + cc] === p) { cells.push(rr * W + cc); rr += dr * s; cc += dc * s; } }
      if (cells.length >= 4) return cells;
    }
    return null;
  },
  full: b => b.every(x => x)
};
const AI = {
  order: [3, 2, 4, 1, 5, 0, 6],
  score(b, me) {
    const op = me === 'A' ? 'B' : 'A'; let s = 0;
    for (let r = 0; r < H; r++) if (b[r * W + 3] === me) s += 3; else if (b[r * W + 3] === op) s -= 3;
    const win = (cells) => { let m = 0, o = 0, e = 0; for (const x of cells) { const v = b[x]; if (v === me) m++; else if (v === op) o++; else e++; }
      if (m && o) return 0; if (m === 3 && e === 1) return 5; if (m === 2 && e === 2) return 2; if (o === 3 && e === 1) return -6; if (o === 2 && e === 2) return -2; return 0; };
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const er = r + dr * 3, ec = c + dc * 3; if (er < 0 || er >= H || ec < 0 || ec >= W) continue;
      s += win([0, 1, 2, 3].map(k => (r + dr * k) * W + c + dc * k));
    }
    return s;
  },
  nega(b, d, a, be, me, turn, ply) {
    const op = turn === 'A' ? 'B' : 'A';
    if (Rules.full(b)) return 0;
    if (d === 0) return (turn === me ? 1 : -1) * this.score(b, me);
    for (const c of this.order) { const r = Rules.drop(b, c, turn); if (r && Rules.line(r.b, r.i)) return 10000 - ply; }
    let best = -1e9;
    for (const c of this.order) {
      const r = Rules.drop(b, c, turn); if (!r) continue;
      const v = -this.nega(r.b, d - 1, -be, -a, me, op, ply + 1);
      if (v > best) best = v; if (v > a) a = v; if (a >= be) break;
    }
    return best;
  },
  pick(b, turn, lvl) {
    const d = { facil: 2, medio: 5, dificil: 8 }[lvl], op = turn === 'A' ? 'B' : 'A';
    const sc = [];
    for (const c of this.order) { const r = Rules.drop(b, c, turn); if (!r) continue; let v = Rules.line(r.b, r.i) ? 100000 : -this.nega(r.b, d - 1, -1e9, 1e9, turn, op, 1); if (lvl === 'facil') v += Math.random() * 40; sc.push({ c, v }); }
    sc.sort((x, y) => y.v - x.v); const top = sc.filter(x => x.v >= sc[0].v - (lvl === 'medio' ? 1 : 0)); return top[Math.floor(Math.random() * top.length)].c;
  }
};
const Game = {
  cfg: null, b: null, moves: [], turn: 'A', result: null, score: { A: 0, B: 0, D: 0 },
  first() { return this.moves.length % 2 === 0 ? this.startWith : (this.startWith === 'A' ? 'B' : 'A'); },
  newGame(cfg, keepScore) { HX.close(); this.cfg = cfg; if (!keepScore) this.score = { A: 0, B: 0, D: 0 }; this.startWith = this.startWith === 'A' && keepScore ? 'B' : 'A'; this.b = Rules.empty(); this.moves = []; this.turn = this.startWith; this.result = null; this.save(); View.render(); UI.turn(); this.maybeAI(); },
  aiSide() { return this.cfg.mode === 'ai' ? (this.cfg.side === 'A' ? 'B' : 'A') : null; },
  human() { return this.turn !== this.aiSide(); },
  play(c) {
    if (this.result) return false; const r = Rules.drop(this.b, c, this.turn); if (!r) { HX.toast('Coluna cheia'); return false; }
    this.b = r.b; this.moves.push(c); HX.sfx('move'); HX.vibrate(8);
    const line = Rules.line(this.b, r.i);
    if (line) { this.result = { win: this.turn, line }; this.score[this.turn]++; } else if (Rules.full(this.b)) { this.result = { win: null }; this.score.D++; }
    if (this.result) this.record();
    this.turn = this.turn === 'A' ? 'B' : 'A'; this.save(); View.render(r.i); UI.turn();
    if (this.result) { const id = this.moves.length; setTimeout(() => { if (this.result && this.moves.length === id) UI.end(); }, 900); } else this.maybeAI();
    return true;
  },
  maybeAI() { if (this.result || this.human()) return; UI.think(true); setTimeout(() => { if (this.result || this.human()) return UI.think(false); const c = AI.pick(this.b, this.turn, this.cfg.diff); UI.think(false); this.play(c); }, 350); },
  rebuild(ms) { this.b = Rules.empty(); this.turn = this.startWith; this.moves = []; this.result = null; for (const c of ms) { const r = Rules.drop(this.b, c, this.turn); this.b = r.b; this.moves.push(c); this.turn = this.turn === 'A' ? 'B' : 'A'; } },
  undo() {
    if (!this.moves.length) return HX.toast('Nada para desfazer');
    if (this.result) { if (this.result.win) this.score[this.result.win]--; else this.score.D--; }
    // contra a IA, volta até a vez do jogador humano
    const ms = this.moves.slice(); ms.pop(); const who = k => k % 2 === 0 ? this.startWith : (this.startWith === 'A' ? 'B' : 'A');
    if (this.cfg.mode === 'ai') while (ms.length && who(ms.length) === this.aiSide()) ms.pop();
    this.rebuild(ms); this.save(); View.render(); UI.turn(); this.maybeAI();
  },
  record() { const st = S.get('stats', {}), k = this.cfg.mode === 'ai' ? this.cfg.diff : 'pvp'; st[k] = st[k] || { w: 0, l: 0, d: 0 }; const r = this.result; st[k][!r.win ? 'd' : this.cfg.mode !== 'ai' || r.win === this.cfg.side ? 'w' : 'l']++; S.set('stats', st); },
  save() { S.set('cur', { cfg: this.cfg, moves: this.moves, startWith: this.startWith, score: this.score, done: !!this.result }); S.hub(this.result ? null : `Em andamento · ${this.cfg.mode === 'ai' ? 'contra IA' : '2 jogadores'} · placar ${this.score.A}×${this.score.B}`); },
  load() { const c = S.get('cur', null); if (!c || !c.cfg) return false; this.cfg = c.cfg; this.startWith = c.startWith || 'A'; this.score = c.score || { A: 0, B: 0, D: 0 }; this.rebuild(c.moves); const last = this.moves.length ? this.lastIndex() : -1; if (last >= 0) { const line = Rules.line(this.b, last); if (line) this.result = { win: this.b[last], line }; else if (Rules.full(this.b)) this.result = { win: null }; } return true; },
  lastIndex() { const c = this.moves[this.moves.length - 1]; for (let r = 0; r < H; r++) if (this.b[r * W + c]) return r * W + c; return -1; }
};
const View = {
  hover: -1,
  init() {
    const g = HX.$('#grid'), cols = HX.$('#cols'), gh = HX.$('#ghost');
    g.innerHTML = Array.from({ length: W * H }, (_, i) => `<div class="cell" data-i="${i}"></div>`).join('');
    cols.innerHTML = Array.from({ length: W }, (_, c) => `<div class="col" data-c="${c}"></div>`).join('');
    gh.innerHTML = Array.from({ length: W }, () => '<div></div>').join('');
    cols.addEventListener('pointermove', e => { const el = e.target.closest('.col'); this.hl(el ? +el.dataset.c : -1); });
    cols.addEventListener('pointerleave', () => this.hl(-1));
    cols.addEventListener('pointerup', e => { const el = e.target.closest('.col'); if (!el || Game.result || !Game.human() || HX.isOpen()) return; this.hl(-1); Game.play(+el.dataset.c); });
    new ResizeObserver(() => this.fit()).observe(HX.$('#stage')); this.fit();
  },
  fit() { const st = HX.$('#stage'); const c = Math.floor(Math.min((st.clientWidth - 24 - 24) / 7, (st.clientHeight - 30 - 20) / 6.8, 86)); document.documentElement.style.setProperty('--c', Math.max(32, c) + 'px'); },
  hl(c) { this.hover = c; HX.$('#cols').querySelectorAll('.col').forEach((e, k) => e.classList.toggle('hov', k === c && !Game.result && Game.human())); HX.$('#ghost').querySelectorAll('div').forEach((e, k) => { e.className = k === c && !Game.result && Game.human() ? 'on disc ' + Game.turn : ''; e.style.position = 'relative'; e.style.inset = 'auto'; }); },
  render(dropped) {
    const cells = HX.$('#grid').children, line = Game.result && Game.result.line || [], last = Game.moves.length ? Game.lastIndex() : -1;
    for (let i = 0; i < W * H; i++) {
      const v = Game.b[i], el = cells[i]; el.classList.toggle('last', i === last && !Game.result);
      if (!v) { el.innerHTML = ''; continue; }
      if (!el.firstChild || !el.firstChild.classList.contains(v)) {
        el.innerHTML = `<div class="disc ${v}"></div>`;
        if (i === dropped) { const d = el.firstChild, r = Math.floor(i / W); d.style.transition = 'none'; d.style.transform = `translateY(${-(r + 1.4) * (el.offsetHeight + 4)}px)`; requestAnimationFrame(() => requestAnimationFrame(() => { d.style.transition = ''; d.style.transform = ''; })); }
      }
      el.firstChild.classList.toggle('win', line.includes(i));
    }
    HX.$('#s-A').textContent = Game.score.A; HX.$('#s-B').textContent = Game.score.B;
  }
};
const UI = {
  dn: { facil: 'fácil', medio: 'médio', dificil: 'difícil' },
  init() {
    View.init();
    HX.$('#t-undo').onclick = () => Game.undo(); HX.$('#t-hist').onclick = () => this.hist(); HX.$('#t-restart').onclick = () => Game.newGame(Game.cfg, true); HX.$('#t-new').onclick = () => this.setup(); HX.$('#menu').onclick = () => this.menu();
    window.addEventListener('keydown', e => { if (HX.isOpen() || !Game.human() || Game.result) return; const n = +e.key; if (n >= 1 && n <= 7) Game.play(n - 1); if (e.key === 'ArrowLeft') View.hl(Math.max(0, (View.hover < 0 ? 3 : View.hover) - 1)); if (e.key === 'ArrowRight') View.hl(Math.min(6, (View.hover < 0 ? 3 : View.hover) + 1)); if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') && View.hover >= 0) Game.play(View.hover); });
    HX.life({ onHide: () => Game.cfg && Game.save() });
    if (Game.load()) { View.render(); this.turn(); if (Game.result) this.end(); else { HX.toast('Partida retomada'); Game.maybeAI(); } }
    else { Game.cfg = { mode: 'ai', diff: 'medio', side: 'A' }; Game.startWith = 'A'; Game.rebuild([]); View.render(); this.turn(); this.setup(); }
  },
  name(x) { const ai = Game.aiSide(); return ai === x ? `IA (${this.dn[Game.cfg.diff]})` : (Game.cfg.mode === 'ai' ? 'Você · ' : '') + (x === 'A' ? 'Ouro' : 'Rubi'); },
  turn() { for (const x of 'AB') { HX.$('#n-' + x).textContent = this.name(x); HX.$('#p-' + x).classList.toggle('on', !Game.result && Game.turn === x); } },
  think(on) { const ai = Game.aiSide(); if (ai) HX.$('#n-' + ai).textContent = on ? 'IA pensando…' : this.name(ai); },
  setup() {
    HX.setup({ title: 'Four', text: 'Solte peças nas colunas e forme uma linha de quatro.', values: S.get('cfg', {}),
      groups: [{ key: 'mode', label: 'Modo', opts: [['ai', 'Contra IA'], ['pvp', '2 jogadores']] }, { key: 'diff', label: 'Dificuldade', opts: [['facil', 'Fácil'], ['medio', 'Médio'], ['dificil', 'Difícil']], show: x => x.mode === 'ai' }, { key: 'side', label: 'Você joga com', opts: [['A', 'Ouro (começa)'], ['B', 'Rubi']], show: x => x.mode === 'ai' }],
      start: 'Nova partida', help: ['Toque numa coluna para soltar sua peça; ela cai até a casa livre mais baixa.', 'Vence quem formar 4 peças seguidas na horizontal, vertical ou diagonal.', 'Se o tabuleiro encher sem vencedor, é empate.', 'Teclado: 1 a 7 soltam na coluna; setas escolhem e Enter solta.', 'Em “Reiniciar”, o placar continua e quem começa alterna.'],
      onStart: x => { S.set('cfg', x); Game.startWith = 'B'; Game.newGame(Object.assign({}, x)); } });
  },
  hist() { const c = HX.overlay(`<h3>Histórico</h3><div class="hist">${Game.moves.length ? `<ol>${Game.moves.map((m, k) => `<li>${(k % 2 === 0 ? Game.startWith : Game.startWith === 'A' ? 'B' : 'A') === 'A' ? 'Ouro' : 'Rubi'} → coluna ${m + 1}</li>`).join('')}</ol>` : 'Nenhuma jogada ainda.'}</div><p>Placar: Ouro ${Game.score.A} × ${Game.score.B} Rubi · empates ${Game.score.D}</p><button class="btn-primary" id="ok">Fechar</button>`, { guard: false, dismiss: () => {} }); HX.on(c, '#ok', () => Game.result ? this.end() : HX.close()); },
  menu() {
    const st = S.get('stats', {}), cell = k => { const x = st[k] || { w: 0, l: 0, d: 0 }; return `<div><b>${x.w}/${x.d}/${x.l}</b><small>${this.dn[k]}</small></div>`; };
    const c = HX.overlay(`<h3>Four</h3><p>Contra a IA: vitórias / empates / derrotas</p><div class="kv">${cell('facil')}${cell('medio')}${cell('dificil')}</div><button class="btn-primary" id="nw">Nova partida</button><button class="btn" id="snd">Som: ${HX.sound() ? 'ligado' : 'desligado'}</button><button class="btn" id="cl">Continuar</button>`, { guard: false, dismiss: () => {} });
    HX.on(c, '#nw', () => this.setup()); HX.on(c, '#cl', () => HX.close()); HX.on(c, '#snd', () => { HX.sound(!HX.sound()); this.menu(); });
  },
  end() {
    const r = Game.result, c = Game.cfg; let t = 'Empate';
    if (r.win) t = c.mode === 'ai' ? (r.win === c.side ? 'Vitória!' : 'Derrota') : (r.win === 'A' ? 'Ouro vence' : 'Rubi vence');
    HX.sfx(t === 'Derrota' ? 'lose' : 'win'); S.hub(null);
    const o = HX.overlay(`<h3>${t}</h3><p>${r.win ? 'Quatro em linha' : 'Tabuleiro cheio'} · ${Game.moves.length} jogadas</p><div class="kv"><div><b>${Game.score.A}</b><small>Ouro</small></div><div><b>${Game.score.D}</b><small>Empates</small></div><div><b>${Game.score.B}</b><small>Rubi</small></div></div><button class="btn-primary" id="ag">Próxima partida</button><div class="row2"><button class="btn" id="bd">Ver tabuleiro</button><button class="btn" id="nw">Mudar modo</button></div>`);
    HX.on(o, '#ag', () => Game.newGame(Game.cfg, true)); HX.on(o, '#bd', () => HX.close()); HX.on(o, '#nw', () => this.setup());
  }
};
UI.init(); HX.sw();
window.FR = { Rules, AI, Game, View, UI, S };
</script>
</body>
</html>
