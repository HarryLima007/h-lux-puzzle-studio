<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f0a06">
<title>H-LUX Backgammon</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#0f0a06;--bg2:radial-gradient(ellipse at 50% 0%,#2c1d10 0%,#0f0a06 64%)}
#cv{display:block;touch-action:manipulation;border-radius:12px;box-shadow:0 0 0 3px #c9a45c,0 20px 50px rgba(0,0,0,.6);cursor:pointer}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.bar{display:flex;align-items:center;gap:10px;justify-content:center;min-height:56px;flex-wrap:wrap}
.dice{display:flex;gap:8px}
.d{width:46px;height:46px;border-radius:11px;background:linear-gradient(160deg,#fff,#e6dcc4);box-shadow:0 3px 0 #a8833f,0 6px 14px rgba(0,0,0,.45);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px}
.d.blk{background:linear-gradient(160deg,#3a3a40,#121216);box-shadow:0 3px 0 #a8833f,0 6px 14px rgba(0,0,0,.45)}
.d i{width:8px;height:8px;border-radius:50%;background:#1a1408;place-self:center;visibility:hidden}.d.blk i{background:#f1dca6}
.d i.v{visibility:visible}.d.used{opacity:.28}
.d.roll{animation:spin .45s ease-in-out}@keyframes spin{50%{transform:rotate(200deg) scale(.85)}}
.act{min-height:46px;padding:0 20px;width:auto}
.msg{font-weight:800;color:var(--accent2);font-size:13.5px;text-align:center;min-height:18px}

<script>
'use strict';
/* H-LUX BACKGAMMON v1.0 — gamão com as regras oficiais (sem cubo de dobra).
   Brancas (0) andam de 24 para 1 e retiram pelo quadrante 1–6; Pretas (1) andam de 1 para 24 e retiram pelo 19–24.
   pts[1..24]: positivo = brancas, negativo = pretas. bar[p], off[p].
   Regra dos dados: é obrigatório usar o máximo de dados possível; se só um puder ser usado, deve ser o maior (quando possível).
   Módulos: Rules (puras) · AI · Game · View · UI */
const S = HX.store('backgammon');
const BAR = 'bar', OFF = 'off';
const Rules = {
  init() { const pts = Array(26).fill(0); pts[24] = 2; pts[13] = 5; pts[8] = 3; pts[6] = 5; pts[1] = -2; pts[12] = -5; pts[17] = -3; pts[19] = -5; return { pts, bar: [0, 0], off: [0, 0] }; },
  clone: s => ({ pts: s.pts.slice(), bar: s.bar.slice(), off: s.off.slice() }),
  key: s => s.pts.join(',') + '|' + s.bar + '|' + s.off,
  n(s, p, i) { const v = s.pts[i]; return p === 0 ? Math.max(0, v) : Math.max(0, -v); },
  opp(s, p, i) { const v = s.pts[i]; return p === 0 ? Math.max(0, -v) : Math.max(0, v); },
  allHome(s, p) { if (s.bar[p]) return false; for (let i = 1; i <= 24; i++) { if (!this.n(s, p, i)) continue; if (p === 0 ? i > 6 : i < 19) return false; } return true; },
  singles(s, p, d) {

  apply(s0, p, m) {

  dice(a, b) { return a === b ? [a, a, a, a] : [a, b]; },
  remove(ds, d) { const r = ds.slice(); r.splice(r.indexOf(d), 1); return r; },
  // máximo de dados utilizáveis a partir de s com os dados ds (memorizado)
  maxUse(s, p, ds, memo = new Map()) {

  // jogadas permitidas agora, considerando os dados restantes e o que já foi jogado no turno

  // todas as sequências completas (sem posições repetidas) — usado pela IA
  sequences(s, p, ds) {

  pip(s, p) { let t = s.bar[p] * 25; for (let i = 1; i <= 24; i++) t += this.n(s, p, i) * (p === 0 ? i : 25 - i); return t; },
  winner(s) { return s.off[0] === 15 ? 0 : s.off[1] === 15 ? 1 : -1; },
  // 1 simples, 2 gamão, 3 backgammon
  points(s, w) { const l = 1 - w; if (s.off[l] > 0) return 1; if (s.bar[l]) return 3; for (let i = 1; i <= 24; i++) if (this.n(s, l, i) && (w === 0 ? i <= 6 : i >= 19)) return 3; return 2; },
  name(p, x) { return x === BAR ? 'bar' : x === OFF ? 'fora' : String(p === 0 ? x : 25 - x); }

const AI = {

  pick(s, p, ds, lvl) {

  }

const Game = {
  cfg: null, s: null, turn: 0, dice: [], rest: [], made: [], snaps: [], phase: 'open', log: [], result: null, score: [0, 0], busy: false,

  aiSide() { return this.cfg.mode === 'ai' ? 1 - this.cfg.side : -1; },
  human() { return this.turn !== this.aiSide(); },
  opening() {

    this.startTurn([a, b]);

  },
  roll() { const a = 1 + Math.floor(Math.random() * 6), b = 1 + Math.floor(Math.random() * 6); this.dice = this.forced || [a, b]; this.forced = null; HX.sfx('dice'); UI.diceRoll(); this.startTurn(this.dice); },
  startTurn(d) {
    this.rest = Rules.dice(d[0], d[1]); this.turnDice = this.rest.slice(); this.made = []; this.snaps = []; this.phase = 'move'; View.sel = null;

  },
  later(fn, ms) { this.busy = true; setTimeout(() => { this.busy = false; fn(); }, ms); },
  legalNow() { return this.phase === 'move' ? Rules.legal(this.s, this.turn, this.rest, this.turnDice, this.made) : []; },
  move(m) {

  },
  undoMove() { if (!this.human() || !this.snaps.length || this.result) return HX.toast('Nada para desfazer neste turno'); const sn = this.snaps.pop(); this.s = sn.s; this.rest = sn.rest; this.made.pop(); this.phase = 'move'; View.sel = null; this.save(); View.draw(); UI.update(); UI.msg('Jogada desfeita'); },
  confirm() { if (this.phase !== 'confirm') return; this.log.push({ p: this.turn, dice: this.dice.slice(), moves: this.made.slice() }); this.endTurn(); },
  endTurn() { this.turn = 1 - this.turn; this.phase = 'roll'; this.rest = []; this.made = []; this.snaps = []; this.save(); View.draw(); UI.update(); UI.msg(this.human() ? (this.cfg.mode === 'ai' ? 'Sua vez: role os dados' : `${UI.color(this.turn)}: role os dados`) : 'IA rolando…'); if (!this.human()) this.later(() => this.roll(), 700); },
  aiPlay() {

    const step = () => { if (k >= seq.length || this.result) { if (!this.result) { this.log.push({ p: this.turn, dice: this.dice.slice(), moves: this.made.slice() }); this.later(() => this.endTurn(), 500); } return; } this.move(seq[k++]); if (!this.result) this.later(step, 520); };

  finish() {

  },
  save() { S.set('cur', { cfg: this.cfg, s: this.s, turn: this.turn, dice: this.dice, rest: this.rest, turnDice: this.turnDice, made: this.made, phase: this.phase, log: this.log.slice(-150), score: this.score, done: !!this.result }); S.hub(this.result || this.phase === 'open' ? null : `Em andamento · ${this.cfg.mode === 'ai' ? 'contra IA' : '2 jogadores'} · placar ${this.score[0]}×${this.score[1]}`); },
  load() { const c = S.get('cur', null); if (!c || !c.cfg) return false; Object.assign(this, { cfg: c.cfg, s: c.s, turn: c.turn, dice: c.dice || [], rest: c.rest || [], turnDice: c.turnDice || [], made: [], snaps: [], phase: c.phase, log: c.log || [], score: c.score || [0, 0], result: null });

};
const View = {
  cv: null, x: null, u: 26, sel: null, dpr: 1,
  init() { this.cv = HX.$('#cv'); this.x = this.cv.getContext('2d'); new ResizeObserver(() => { this.size(); this.draw(); }).observe(HX.$('#stage')); this.size(); this.cv.addEventListener('click', e => this.tap(e)); },
  size() { const st = HX.$('#stage'); this.u = Math.floor(Math.min((st.clientWidth - 8) / 14, (st.clientHeight - 100) / 12.4, 60)); this.u = Math.max(18, this.u); this.W = this.u * 14; this.H = Math.round(this.u * 12.4); this.dpr = Math.min(devicePixelRatio || 1, 2); this.cv.width = this.W * this.dpr; this.cv.height = this.H * this.dpr; this.cv.style.width = this.W + 'px'; this.cv.style.height = this.H + 'px'; },
  // coluna e metade de cada ponto (perspectiva das brancas)

  draw() {

    const stack = (n, p, cx, top, hl, base) => { if (!n) return; const step = Math.min(u * .92, (u * 4.6) / Math.max(1, n - 1)); for (let k = 0; k < n; k++) { const cy = top ? base + u * .5 + k * step : base - u * .5 - k * step; chk(cx, cy, p, hl && k === n - 1); }
      if (n > 5) { const cy = top ? base + u * .5 + (n - 1) * step : base - u * .5 - (n - 1) * step; x.fillStyle = p === 0 ? '#1a1408' : '#f1dca6'; x.font = `800 ${Math.round(u * .38)}px Manrope,sans-serif`; x.fillText(n, cx, cy + 1); } };
    for (let i = 1; i <= 24; i++) { const [c, b] = this.col(i), v = s.pts[i]; if (!v) continue; const p = v > 0 ? 0 : 1; stack(Math.abs(v), p, c * u + u / 2, b === 0, (this.sel === i) || (this.sel === null && srcs.has(i)), b === 0 ? u * .15 : H - u * .15); }
    // barra: brancas na metade de cima, pretas na de baixo
    for (const p of [0, 1]) { const n = s.bar[p]; for (let k = 0; k < n; k++) chk(u * 6.5, p === 0 ? half - u * .6 - k * u * .55 : half + u * .6 + k * u * .55, p, k === n - 1 && (this.sel === BAR || (this.sel === null && srcs.has(BAR)))); }
    // bandeja de peças retiradas: brancas embaixo, pretas em cima
    for (const p of [0, 1]) { const n = s.off[p]; for (let k = 0; k < n; k++) { const y = p === 0 ? H - u * .3 - k * u * .32 : u * .3 + k * u * .32; x.fillStyle = p === 0 ? '#ece5d4' : '#222228'; x.fillRect(u * 13.12, y - u * .13, u * .76, u * .26); x.strokeStyle = 'rgba(201,164,92,.7)'; x.lineWidth = 1; x.strokeRect(u * 13.12, y - u * .13, u * .76, u * .26); } }
    if (tg.some(m => m.to === OFF)) { x.strokeStyle = '#fff6c8'; x.lineWidth = 3; const y0 = Game.turn === 0 ? half : 0; x.strokeRect(u * 13 + 2, y0 + 2, u - 4, half - 4); }
  },
  hit(e) { const r = this.cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, c = Math.floor(px / this.u), top = py < this.H / 2;
    if (c === 6) return BAR; if (c >= 13) return OFF; const k = c > 6 ? c - 1 : c; // 0..11 sem a barra
    if (top) return k <= 5 ? 13 + k : 19 + (k - 6); return k <= 5 ? 12 - k : 6 - (k - 6); },
  tap(e) {
    if (HX.isOpen() || Game.busy || !Game.human() || Game.phase !== 'move') return; const t = this.hit(e), legal = Game.legalNow();
    if (this.sel !== null) { const m = legal.filter(mm => mm.from === this.sel && mm.to === t).sort((a, b) => a.d - b.d)[0]; if (m) return Game.move(m); }
    if (legal.some(m => m.from === t)) { this.sel = t; HX.sfx('tap'); return this.draw(); }
    // toque direto no destino quando só uma origem leva até ele
    const dst = legal.filter(m => m.to === t); if (dst.length && new Set(dst.map(m => m.from)).size === 1) return Game.move(dst[0]);
    if (this.sel !== null) { this.sel = null; this.draw(); }
    HX.toast(legal.length ? 'Toque numa peça destacada' : 'Sem jogadas');
  }
};
const UI = {
  dn: { facil: 'fácil', medio: 'médio', dificil: 'difícil' },
  color: p => p === 0 ? 'Brancas' : 'Pretas',
  init() {
    View.init();
    HX.$('#act').onclick = () => { if (HX.isOpen() || Game.busy || Game.result) return; if (Game.phase === 'open') return Game.opening(); if (!Game.human()) return; if (Game.phase === 'roll') return Game.roll(); if (Game.phase === 'confirm') return Game.confirm(); HX.toast('Mova as peças com os dados'); };
    HX.$('#t-undo').onclick = () => Game.undoMove(); HX.$('#t-hist').onclick = () => this.hist(); HX.$('#t-rules').onclick = () => HX.help('Regras do gamão', this.helpItems); HX.$('#t-new').onclick = () => this.setup(); HX.$('#menu').onclick = () => this.menu();
    addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !HX.isOpen()) { e.preventDefault(); HX.$('#act').click(); } if ((e.key === 'z' || e.key === 'Backspace') && !HX.isOpen()) Game.undoMove(); });
    HX.life({ onHide: () => Game.cfg && Game.save() });
    if (Game.load()) { View.draw(); this.update(); HX.toast('Partida retomada'); if (!Game.human()) { if (Game.phase === 'roll') Game.later(() => Game.roll(), 600); else if (Game.phase === 'move' || Game.phase === 'confirm') Game.later(() => Game.phase === 'confirm' ? (Game.log.push({ p: Game.turn, dice: Game.dice.slice(), moves: Game.made.slice() }), Game.endTurn()) : Game.aiPlay(), 600); } else this.msg(Game.phase === 'roll' ? 'Role os dados' : Game.phase === 'open' ? 'Rolem para decidir quem começa' : 'Continue seu lance'); }
    else { Game.cfg = { mode: 'ai', diff: 'medio', side: 0 }; Game.s = Rules.init(); View.draw(); this.update(); this.setup(); }
  },
  name(p) { return Game.aiSide() === p ? `IA (${this.dn[Game.cfg.diff]})` : (Game.cfg.mode === 'ai' ? 'Você · ' : '') + this.color(p); },
  msg(t) { HX.$('#msg').textContent = t; },
  update() {
    for (const p of [0, 1]) { HX.$('#n-' + p).textContent = `${this.name(p)}${Game.score[0] + Game.score[1] ? ` (${Game.score[p]})` : ''}`; HX.$('#s-' + p).textContent = Rules.pip(Game.s, p); HX.$('#p-' + p).classList.toggle('on', Game.phase !== 'open' && !Game.result && Game.turn === p); }
    const used = Game.turnDice ? Game.turnDice.length - Game.rest.length : 0;
    const ds = Game.phase === 'open' || !Game.dice.length ? [] : Game.dice[0] === Game.dice[1] ? [Game.dice[0], Game.dice[0], Game.dice[0], Game.dice[0]] : Game.dice;
    HX.$('#dice').innerHTML = ds.map((d, k) => { const on = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] }[d]; const isUsed = Game.phase === 'move' || Game.phase === 'confirm' ? (Game.dice[0] === Game.dice[1] ? k < used : !Game.rest.includes(d) || (Game.rest.length === 0)) : false; return `<div class="d ${Game.turn === 1 ? 'blk' : ''} ${isUsed ? 'used' : ''}">${Array.from({ length: 9 }, (_, i) => `<i class="${on.includes(i) ? 'v' : ''}"></i>`).join('')}</div>`; }).join('');
    const a = HX.$('#act'); const h = Game.human();
    a.textContent = Game.phase === 'open' ? 'Rolar para começar' : Game.phase === 'roll' ? (h ? 'Rolar dados' : 'Aguarde…') : Game.phase === 'confirm' ? (h ? 'Confirmar lance' : 'Aguarde…') : Game.phase === 'over' ? 'Fim de jogo' : h ? 'Mova as peças' : 'IA jogando…';
    a.disabled = !(Game.phase === 'open' || (h && (Game.phase === 'roll' || Game.phase === 'confirm')));
  },
  diceRoll() { this.update(); HX.$('#dice').querySelectorAll('.d').forEach(d => { d.classList.remove('roll'); void d.offsetWidth; d.classList.add('roll'); }); },
  helpItems: ['Cada jogador tem 15 peças. As Brancas andam do ponto 24 para o 1; as Pretas no sentido contrário. O número em cada lado é a contagem de pontos (pips) que falta.', 'Role os dados e mova uma peça para cada número. Duplas valem quatro movimentos.', 'Não é possível parar num ponto com 2 ou mais peças adversárias. Parar sobre uma peça adversária isolada a captura: ela vai para a barra.', 'Quem tem peça na barra precisa reentrar no quadrante inicial do adversário antes de qualquer outro movimento.', 'É obrigatório usar o máximo possível dos dados. Se só um dos dois puder ser usado, deve ser o maior.', 'Com todas as peças no seu quadrante final, você pode retirá-las. Número maior que o necessário só retira a peça mais distante.', 'Vence quem retirar as 15 peças. Gamão (adversário sem retirar nenhuma) vale 2 pontos; backgammon (e ainda com peça na barra ou no seu quadrante) vale 3. Esta versão não usa o cubo de dobra.', 'Como jogar: toque numa peça destacada e depois no destino iluminado. "Desfazer" volta jogadas do turno atual antes de confirmar.'],
  setup() {
    HX.setup({ title: 'Backgammon', text: 'Gamão com as regras oficiais.', values: Object.assign({ mode: 'ai', diff: 'medio', side: 0 }, S.get('cfg', {})),
      groups: [{ key: 'mode', label: 'Modo', opts: [['ai', 'Contra IA'], ['pvp', '2 jogadores']] }, { key: 'diff', label: 'Dificuldade', opts: [['facil', 'Fácil'], ['medio', 'Médio'], ['dificil', 'Difícil']], show: x => x.mode === 'ai' }, { key: 'side', label: 'Você joga com', opts: [[0, 'Brancas'], [1, 'Pretas']], show: x => x.mode === 'ai' }],
      start: 'Nova partida', help: this.helpItems, onStart: x => { S.set('cfg', x); Game.newGame(Object.assign({}, x)); } });
  },
  hist() { const c = HX.overlay(`<h3>Lances</h3><div class="hist">${Game.log.length ? `<ol>${Game.log.map(l => `<li>${this.color(l.p)} ${l.dice.join('-')}: ${l.moves.length ? l.moves.map(m => `${Rules.name(l.p, m.from)}/${Rules.name(l.p, m.to)}${m.hit ? '*' : ''}`).join(' ') : 'sem jogada'}</li>`).join('')}</ol>` : 'Nenhum lance ainda.'}</div><p>* = captura. Pontos contados do ponto de vista de quem joga.</p><button class="btn-primary" id="ok">Fechar</button>`, { guard: false, dismiss: () => {} }); HX.on(c, '#ok', () => Game.result ? this.end() : HX.close()); },
  menu() {
    const st = S.get('stats', {}), cell = k => { const x = st[k] || { w: 0, l: 0 }; return `<div><b>${x.w}/${x.l}</b><small>${this.dn[k]}</small></div>`; };
    const c = HX.overlay(`<h3>Backgammon</h3><p>Contra a IA: vitórias / derrotas</p><div class="kv">${cell('facil')}${cell('medio')}${cell('dificil')}</div><button class="btn-primary" id="nw">Nova partida</button><div class="row2"><button class="btn" id="hw">Regras</button><button class="btn" id="snd">Som: ${HX.sound() ? 'on' : 'off'}</button></div><button class="btn" id="cl">Continuar</button>`, { guard: false, dismiss: () => {} });
    HX.on(c, '#nw', () => this.setup()); HX.on(c, '#cl', () => HX.close()); HX.on(c, '#hw', () => HX.help('Regras do gamão', this.helpItems)); HX.on(c, '#snd', () => { HX.sound(!HX.sound()); this.menu(); });
  },
  end() {
    const r = Game.result, cf = Game.cfg, kind = ['', 'Vitória simples', 'Gamão', 'Backgammon'][r.pts];
    const t = cf.mode === 'ai' ? (r.win === cf.side ? 'Vitória!' : 'Derrota') : `${this.color(r.win)} vencem`;
    HX.sfx(t === 'Derrota' ? 'lose' : 'win'); S.hub(null);
    const o = HX.overlay(`<h3>${t}</h3><p>${kind} · ${r.pts} ponto${r.pts > 1 ? 's' : ''}</p><div class="kv"><div><b>${Game.score[0]}</b><small>Brancas</small></div><div><b>${Game.log.length}</b><small>Lances</small></div><div><b>${Game.score[1]}</b><small>Pretas</small></div></div><button class="btn-primary" id="ag">Próxima partida</button><div class="row2"><button class="btn" id="bd">Ver tabuleiro</button><button class="btn" id="nw">Mudar modo</button></div>`);
    HX.on(o, '#ag', () => Game.newGame(Game.cfg, true)); HX.on(o, '#bd', () => HX.close()); HX.on(o, '#nw', () => this.setup());
  }
};
UI.init(); HX.sw();
window.BG = { Rules, AI, Game, View, UI, S };
</script>
