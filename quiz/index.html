<script>
'use strict';
/* H-LUX QUIZ v1.0 — conhecimentos gerais em português. 8 categorias, 3 dificuldades, rodadas de 10 perguntas.
   Modo com tempo (15 s por pergunta, bônus por rapidez) e modo sem tempo. Sequência de acertos multiplica os pontos.
   Banco com respostas conferidas (fatos estáveis); as alternativas são embaralhadas a cada rodada e as perguntas
   recentes não se repetem logo. Recordes por modo. Módulos: Q · Game · UI */
const S = HX.store('quiz');
const CATS = ['Geografia', 'História', 'Ciências', 'Língua Portuguesa', 'Matemática', 'Esportes', 'Artes e Cultura', 'Tecnologia'];
/* [categoria, dificuldade 0-2, pergunta, correta, errada, errada, errada] */
const Q = [
  [0, 0, 'Qual é a capital do Brasil?', 'Brasília', 'Rio de Janeiro', 'São Paulo', 'Salvador'], [0, 0, 'Qual é o maior oceano do planeta?', 'Pacífico', 'Atlântico', 'Índico', 'Ártico'],
  [0, 0, 'Quantos estados tem o Brasil (sem contar o Distrito Federal)?', '26', '25', '27', '24'], [0, 0, 'Em qual continente fica o Egito?', 'África', 'Ásia', 'Europa', 'Oceania'],
  [0, 1, 'Qual é o maior país do mundo em área?', 'Rússia', 'Canadá', 'China', 'Estados Unidos'], [0, 1, 'Qual é a capital da Austrália?', 'Camberra', 'Sydney', 'Melbourne', 'Perth'], [0, 1, 'Qual é a montanha mais alta do mundo acima do nível do mar?', 'Monte Everest', 'K2', 'Aconcágua', 'Kilimanjaro'],
  [0, 1, 'Qual estado brasileiro tem a maior área?', 'Amazonas', 'Pará', 'Mato Grosso', 'Minas Gerais'], [0, 2, 'Qual é a capital do Canadá?', 'Ottawa', 'Toronto', 'Montreal', 'Vancouver'],
  [0, 2, 'Qual é o ponto mais alto do Brasil?', 'Pico da Neblina', 'Pico da Bandeira', 'Monte Roraima', 'Pico das Agulhas Negras'], [0, 2, 'Qual deserto é o maior deserto quente do mundo?', 'Saara', 'Atacama', 'Gobi', 'Kalahari'],
  [1, 0, 'Em que ano os portugueses chegaram ao Brasil, com Pedro Álvares Cabral?', '1500', '1492', '1822', '1530'], [1, 0, 'Quem proclamou a Independência do Brasil?', 'Dom Pedro I', 'Dom Pedro II', 'Tiradentes', 'Deodoro da Fonseca'],
  [1, 0, 'Em que ano foi proclamada a Independência do Brasil?', '1822', '1889', '1500', '1888'], [1, 1, 'Em que ano foi assinada a Lei Áurea, que aboliu a escravidão no Brasil?', '1888', '1822', '1889', '1871'],
  [1, 1, 'Quem foi o primeiro presidente do Brasil?', 'Deodoro da Fonseca', 'Getúlio Vargas', 'Floriano Peixoto', 'Prudente de Morais'], [1, 1, 'Em que ano foi proclamada a República no Brasil?', '1889', '1822', '1888', '1930'],
  [1, 1, 'Qual civilização construiu Machu Picchu?', 'Inca', 'Asteca', 'Maia', 'Olmeca'], [1, 1, 'Em que ano terminou a Segunda Guerra Mundial?', '1945', '1918', '1939', '1950'],
  [1, 2, 'Qual cidade foi a capital do Brasil antes de Brasília?', 'Rio de Janeiro', 'Salvador', 'São Paulo', 'Belo Horizonte'], [1, 2, 'Em que ano Brasília foi inaugurada?', '1960', '1950', '1964', '1955'],
  [1, 2, 'Quem assinou a Lei Áurea?', 'Princesa Isabel', 'Dom Pedro II', 'Dom João VI', 'Imperatriz Leopoldina'], [1, 2, 'Em que ano caiu o Muro de Berlim?', '1989', '1991', '1985', '1961'],
  [2, 0, 'Qual planeta é conhecido como "Planeta Vermelho"?', 'Marte', 'Vênus', 'Júpiter', 'Mercúrio'], [2, 0, 'Qual é o maior planeta do Sistema Solar?', 'Júpiter', 'Saturno', 'Netuno', 'Terra'],
  [2, 0, 'Qual gás as plantas absorvem do ar para fazer fotossíntese?', 'Gás carbônico (CO₂)', 'Oxigênio', 'Nitrogênio', 'Hélio'], [2, 0, 'Quantos ossos tem, em média, o corpo humano adulto?', '206', '106', '306', '256'],
  [2, 1, 'Qual é o símbolo químico do ouro?', 'Au', 'Ag', 'Ou', 'Go'], [2, 1, 'Qual é a fórmula química da água?', 'H₂O', 'CO₂', 'O₂', 'H₂O₂'],
  [2, 1, 'Qual órgão do corpo humano bombeia o sangue?', 'Coração', 'Pulmão', 'Fígado', 'Rim'], [2, 1, 'Qual é o planeta mais próximo do Sol?', 'Mercúrio', 'Vênus', 'Marte', 'Terra'],
  [2, 1, 'A que temperatura a água pura ferve ao nível do mar?', '100 °C', '90 °C', '120 °C', '80 °C'], [2, 2, 'Qual é o maior órgão do corpo humano?', 'Pele', 'Fígado', 'Intestino', 'Pulmão'],
  [2, 2, 'Qual é o elemento químico mais abundante no universo?', 'Hidrogênio', 'Oxigênio', 'Carbono', 'Hélio'], [2, 2, 'Qual cientista formulou a teoria da relatividade?', 'Albert Einstein', 'Isaac Newton', 'Galileu Galilei', 'Nikola Tesla'],
  [2, 2, 'Qual é a velocidade aproximada da luz no vácuo?', '300.000 km/s', '30.000 km/s', '3.000 km/s', '3.000.000 km/s'],
  [3, 0, 'Qual é o plural de "cidadão"?', 'Cidadãos', 'Cidadões', 'Cidadães', 'Cidadãs'], [3, 0, 'Qual palavra está escrita corretamente?', 'Exceção', 'Excessão', 'Esceção', 'Excesão'],
  [3, 0, 'Qual é o antônimo de "alegre"?', 'Triste', 'Feliz', 'Contente', 'Animado'], [3, 1, 'Quem escreveu "Dom Casmurro"?', 'Machado de Assis', 'José de Alencar', 'Jorge Amado', 'Graciliano Ramos'],
  [3, 1, 'Quantas sílabas tem a palavra "paralelepípedo"?', '7', '6', '8', '5'], [3, 1, 'Qual destas palavras é uma proparoxítona?', 'Lâmpada', 'Café', 'Cadeira', 'Amor'],
  [3, 1, 'Quem escreveu "Grande Sertão: Veredas"?', 'Guimarães Rosa', 'Clarice Lispector', 'Graciliano Ramos', 'Euclides da Cunha'], [3, 2, 'Quem escreveu "Os Lusíadas"?', 'Luís de Camões', 'Fernando Pessoa', 'Eça de Queirós', 'Gil Vicente'],
  [3, 2, 'Quem escreveu "Vidas Secas"?', 'Graciliano Ramos', 'Rachel de Queiroz', 'Jorge Amado', 'Érico Veríssimo'], [3, 2, 'Em "Os meninos jogaram bola", qual é o sujeito?', 'Os meninos', 'Bola', 'Jogaram', 'Jogaram bola'],
  [4, 0, 'Quanto é 7 × 8?', '56', '54', '48', '64'], [4, 0, 'Quanto é metade de 150?', '75', '70', '80', '65'], [4, 0, 'Quantos lados tem um hexágono?', '6', '5', '8', '7'],
  [4, 1, 'Qual é a raiz quadrada de 144?', '12', '14', '11', '13'], [4, 1, 'Quanto é 15% de 200?', '30', '15', '20', '35'], [4, 1, 'Qual é o próximo número primo depois de 7?', '11', '9', '13', '10'],
  [4, 1, 'Quanto mede a soma dos ângulos internos de um triângulo?', '180°', '360°', '90°', '270°'], [4, 2, 'Quanto é 2 elevado a 10?', '1024', '512', '2048', '1000'],
  [4, 2, 'Qual é o valor aproximado de π (pi) com duas casas decimais?', '3,14', '3,41', '3,12', '3,16'], [4, 2, 'Quantos segundos há em uma hora?', '3600', '360', '6000', '1440'],
  [4, 2, 'Se x + 5 = 12, quanto vale 3x?', '21', '17', '15', '36'],
  [5, 0, 'Quantos jogadores de cada time ficam em campo numa partida de futebol?', '11', '10', '12', '9'], [5, 0, 'Quantas Copas do Mundo masculinas de futebol o Brasil venceu?', '5', '4', '6', '3'],
  [5, 0, 'Em qual esporte se usa uma raquete e uma peteca?', 'Badminton', 'Tênis', 'Squash', 'Vôlei'], [5, 1, 'Quantos pontos vale uma cesta feita de trás da linha de três no basquete?', '3', '2', '4', '1'],
  [5, 1, 'De quantos em quantos anos acontecem os Jogos Olímpicos de Verão?', '4', '2', '3', '5'], [5, 1, 'Qual piloto brasileiro foi tricampeão de Fórmula 1 em 1988, 1990 e 1991?', 'Ayrton Senna', 'Nelson Piquet', 'Emerson Fittipaldi', 'Rubens Barrichello'],
  [5, 1, 'Quantos jogadores de cada time ficam em quadra no vôlei de quadra?', '6', '5', '7', '4'], [5, 2, 'Em que ano o Brasil sediou a Copa do Mundo pela segunda vez?', '2014', '2010', '2018', '2002'],
  [5, 2, 'Quantas casas tem um tabuleiro de xadrez?', '64', '81', '100', '49'], [5, 2, 'Qual é a distância oficial de uma maratona?', '42,195 km', '40 km', '21,097 km', '50 km'],
  [6, 0, 'Quem pintou a "Mona Lisa"?', 'Leonardo da Vinci', 'Michelangelo', 'Rafael', 'Van Gogh'], [6, 0, 'Qual instrumento tem teclas brancas e pretas e 88 teclas no padrão moderno?', 'Piano', 'Violão', 'Violino', 'Flauta'],
  [6, 1, 'Quem pintou o quadro "Abaporu"?', 'Tarsila do Amaral', 'Anita Malfatti', 'Candido Portinari', 'Di Cavalcanti'], [6, 1, 'Em que cidade fica o Cristo Redentor?', 'Rio de Janeiro', 'Salvador', 'São Paulo', 'Belo Horizonte'],
  [6, 1, 'Quem compôs a "Nona Sinfonia" com o coral "Ode à Alegria"?', 'Beethoven', 'Mozart', 'Bach', 'Chopin'], [6, 1, 'Qual gênero musical é o grande símbolo dos desfiles das escolas do Carnaval do Rio de Janeiro?', 'Samba', 'Forró', 'Frevo', 'Axé'],
  [6, 2, 'Em que ano aconteceu a Semana de Arte Moderna em São Paulo?', '1922', '1930', '1912', '1945'], [6, 2, 'Quem pintou "A Noite Estrelada"?', 'Vincent van Gogh', 'Claude Monet', 'Pablo Picasso', 'Salvador Dalí'],
  [6, 2, 'Qual arquiteto projetou os principais edifícios de Brasília?', 'Oscar Niemeyer', 'Lúcio Costa', 'Burle Marx', 'Lina Bo Bardi'], [6, 2, 'Em que cidade brasileira nasceu o frevo?', 'Recife', 'Salvador', 'São Luís', 'Fortaleza'],
  [7, 0, 'O que significa a sigla "Wi-Fi" na prática?', 'Rede sem fio', 'Cabo de rede', 'Bateria', 'Impressora'], [7, 0, 'Qual destas é uma unidade de armazenamento de dados?', 'Gigabyte', 'Gigahertz', 'Watt', 'Pixel'],
  [7, 1, 'Quantos bits tem um byte?', '8', '4', '16', '10'], [7, 1, 'O que significa a sigla "CPU"?', 'Unidade Central de Processamento', 'Central de Programas Úteis', 'Controle de Potência Universal', 'Cópia de Programas do Usuário'],
  [7, 1, 'Qual sistema numérico os computadores usam internamente?', 'Binário', 'Decimal', 'Romano', 'Hexadecimal apenas'], [7, 2, 'O que significa "HTML"?', 'Linguagem de marcação de hipertexto', 'Linguagem de programação de máquinas', 'Protocolo de transferência de arquivos', 'Sistema operacional da web'],
  [7, 2, 'Quantos bytes tem, aproximadamente, 1 kilobyte (no sistema binário)?', '1024', '1000', '512', '2048'], [7, 2, 'Qual protocolo é usado para páginas web seguras (com cadeado)?', 'HTTPS', 'FTP', 'SMTP', 'HTTP'],
  [7, 2, 'Em que década surgiu a World Wide Web (a "web")?', 'Anos 1990 (proposta em 1989)', 'Anos 1970', 'Anos 1960', 'Anos 2000']
];
const POOL = Q.map((q, i) => ({ i, c: q[0], d: q[1], q: q[2], a: q[3], w: q.slice(4) }));
const Game = {
  state: 'idle', set: [], k: 0, pts: 0, streak: 0, best: 0, right: 0, timed: true, cat: -1, diff: -1, t: 15, locked: false,
  start(timed, cat, diff) {
    HX.close(); this.timed = timed; this.cat = cat; this.diff = diff; const recent = S.get('recent', []);
    let pool = POOL.filter(q => (cat < 0 || q.c === cat) && (diff < 0 || q.d === diff)); let fresh = pool.filter(q => !recent.includes(q.i)); if (fresh.length < 10) fresh = pool;
    this.set = HX.shuffle(fresh.slice()).slice(0, Math.min(10, fresh.length)); S.set('recent', recent.concat(this.set.map(q => q.i)).slice(-40));
    this.k = 0; this.pts = 0; this.streak = 0; this.best = 0; this.right = 0; this.state = 'play'; this.show();
  },
  show() { const q = this.set[this.k]; this.opts = HX.shuffle([q.a, ...q.w]); this.t = 15; this.locked = false; UI.show(q, this.opts); },
  answer(i) { if (this.locked || this.state !== 'play') return; this.locked = true; const q = this.set[this.k], ok = this.opts[i] === q.a;
    if (ok) { this.streak++; this.right++; this.best = Math.max(this.best, this.streak); const base = [100, 150, 200][q.d], spd = this.timed ? Math.round(this.t / 15 * 100) : 0, mul = 1 + Math.min(4, Math.floor(this.streak / 3)) * .25; this.pts += Math.round((base + spd) * mul); HX.sfx('win'); }
    else { this.streak = 0; HX.sfx('lose'); HX.vibrate(30); }
    UI.reveal(i, this.opts.indexOf(q.a), ok, i < 0); setTimeout(() => this.next(), ok ? 900 : 1700); },
  next() { if (this.state !== 'play') return; this.k++; if (this.k >= this.set.length) return this.end(); this.show(); },
  step(dt) { if (this.state !== 'play' || !this.timed || this.locked) return; this.t -= dt; UI.timer(); if (this.t <= 0) { this.t = 0; this.answer(-1); } },
  end() {
    this.state = 'over'; const key = (this.timed ? 'T' : 'L'); const rec = HXA.best(S, 'best' + key, this.pts); HXA.best(S, 'streak', this.best); const st = S.get('stats', { games: 0, right: 0, total: 0 }); st.games++; st.right += this.right; st.total += this.set.length; S.set('stats', st);
    S.hub(`Recorde ${Math.max(S.get('bestT', 0), S.get('bestL', 0))} · ${Math.round(st.right / Math.max(1, st.total) * 100)}% de acertos`);
    HXA.menu({ title: `${this.right}/${this.set.length} acertos`, text: `${this.timed ? 'Com tempo' : 'Sem tempo'} · ${this.cat < 0 ? 'Todas as categorias' : CATS[this.cat]}${rec && this.pts ? ' · novo recorde!' : ''}`, stats: [[this.pts, 'Pontos'], [this.best, 'Maior sequência'], [S.get('best' + key, 0), 'Recorde']], primary: ['Nova rodada', () => this.start(this.timed, this.cat, this.diff)], buttons: [['Menu', () => UI.home()]] });
  }
};
const UI = {
  sel: { timed: true, cat: -1, diff: -1 },
  show(q, opts) { HX.$('#qcat').textContent = `${CATS[q.c]} · ${['Fácil', 'Médio', 'Difícil'][q.d]}`; HX.$('#qq').textContent = q.q; HX.$('#qa').innerHTML = opts.map((o, i) => `<button data-i="${i}"><b>${'ABCD'[i]}</b>${HX.esc(o)}</button>`).join(''); HX.$('#qx').textContent = ''; HX.$('#qt').style.visibility = Game.timed ? 'visible' : 'hidden'; this.timer(); this.hud(); },
  reveal(i, ci, ok, timeout) { const bs = HX.$('#qa').querySelectorAll('button'); bs[ci].classList.add('ok'); if (i >= 0 && !ok) bs[i].classList.add('bad'); HX.$('#qx').textContent = ok ? 'Correto!' : timeout ? 'Tempo esgotado!' : `Resposta certa: ${Game.set[Game.k].a}`; this.hud(); },
  timer() { HX.$('#qti').style.width = (Game.t / 15 * 100) + '%'; },
  hud() { HX.$('#qn').textContent = `${Math.min(Game.k + 1, Game.set.length)}/${Game.set.length}`; HX.$('#pts').textContent = Game.pts; HX.$('#streak').textContent = Game.streak; },
  init() {
    HX.$('#qa').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) Game.answer(+b.dataset.i); });
    addEventListener('keydown', e => { const i = 'abcd1234'.indexOf(e.key.toLowerCase()); if (i >= 0 && Game.state === 'play' && !HX.isOpen()) Game.answer(i % 4); if (e.key === 'p' || e.key === 'Escape') this.pause(); }); HX.$('#menu').onclick = () => this.pause();
    let last = performance.now(); const loop = t => { const dt = Math.min(.1, (t - last) / 1000); last = t; if (!HX.isOpen()) Game.step(dt); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
    HX.life({ onHide: () => { if (Game.state === 'play') this.pause(); } }); this.home();
  },
  help: ['Responda 10 perguntas de múltipla escolha tocando na alternativa (no PC também A, B, C, D ou 1 a 4).', 'Com tempo: 15 s por pergunta e bônus por responder rápido. Sem tempo: pense com calma (sem bônus de rapidez).', 'Perguntas difíceis valem mais. A cada 3 acertos seguidos o multiplicador sobe (até ×2).', 'Escolha uma categoria e uma dificuldade, ou "Todas" para misturar. As perguntas recentes não se repetem logo.'],
  home() { const sel = this.sel, st = S.get('stats', { games: 0, right: 0, total: 0 });
    HXA.menu({ title: 'Quiz', text: `${POOL.length} perguntas em ${CATS.length} categorias.`, stats: [[S.get('bestT', 0), 'Recorde (tempo)'], [S.get('bestL', 0), 'Recorde (livre)'], [st.total ? Math.round(st.right / st.total * 100) + '%' : '—', 'Acertos']],
      html: `<div class="segs"><div class="segg"><small>Modo</small><div class="seg" id="sm"><button data-v="1" class="${sel.timed ? 'on' : ''}">Com tempo</button><button data-v="0" class="${!sel.timed ? 'on' : ''}">Sem tempo</button></div></div>
        <div class="segg"><small>Categoria</small><select id="sc" style="width:100%;min-height:42px;border-radius:10px;background:#141416;color:var(--fg);border:1px solid var(--line);padding:6px"><option value="-1">Todas</option>${CATS.map((c, i) => `<option value="${i}" ${sel.cat === i ? 'selected' : ''}>${c} (${POOL.filter(q => q.c === i).length})</option>`).join('')}</select></div>
        <div class="segg"><small>Dificuldade</small><div class="seg" id="sd">${['Todas', 'Fácil', 'Médio', 'Difícil'].map((n, i) => `<button data-v="${i - 1}" class="${sel.diff === i - 1 ? 'on' : ''}">${n}</button>`).join('')}</div></div></div>`,
      primary: ['Começar', () => Game.start(sel.timed, sel.cat, sel.diff)], help: this.help });
    const c = document.querySelector('.hx-card'); c.querySelectorAll('#sm [data-v]').forEach(b => b.onclick = () => { sel.timed = b.dataset.v === '1'; this.home(); }); c.querySelectorAll('#sd [data-v]').forEach(b => b.onclick = () => { sel.diff = +b.dataset.v; this.home(); }); c.querySelector('#sc').onchange = e => { sel.cat = +e.target.value; }; },
  pause() { if (Game.state !== 'play') return this.home(); HXA.menu({ title: 'Pausa', text: `Pergunta ${Game.k + 1}/${Game.set.length}`, primary: ['Continuar', () => {}], buttons: [['Desistir da rodada', () => { Game.state = 'idle'; this.home(); }]] }); }
};
UI.init(); HX.sw();
window.QZ = { Game, UI, S, POOL, Q };

</script>
