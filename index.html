<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="description" content="H-LUX — coleção de minijogos: Puzzle Studio, Mahjong e mais.">
<title>H-LUX</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="H-LUX">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--panel:#151517;--line:#2b2924;--gold:#c9a45c;--gold2:#e8cd8c;--text:#ece8e1;--muted:#9a948b;--faint:#6b665f;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#1d1a14 0%,var(--bg) 60%) fixed;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto}
header{display:flex;flex-direction:column;align-items:center;gap:10px;padding:5vh 0 26px;text-align:center}
header svg{width:64px;height:64px}
.word{font-family:var(--serif);font-weight:600;font-size:52px;letter-spacing:9px;line-height:1;background:linear-gradient(180deg,#f1dca6,#c39a4f);-webkit-background-clip:text;background-clip:text;color:transparent;padding-left:9px}
.sub{font-size:11px;letter-spacing:5px;color:var(--muted);font-weight:600}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(201,164,92,.45),transparent);margin:6px auto 0;width:min(420px,80%)}
h2{font-size:11.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--gold);font-weight:700;margin:8px 4px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;transition:transform .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-3px);border-color:#4a4335}
.card:active{transform:translateY(0)}
.cover{aspect-ratio:16/10;background:#000 center/cover no-repeat;position:relative}
.cover .status{position:absolute;left:12px;bottom:12px;right:12px;display:flex}
.pill{background:rgba(10,10,11,.82);border:1px solid rgba(201,164,92,.45);color:var(--gold2);font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{display:flex;align-items:baseline;gap:8px}
.name b{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:.3px}
.name small{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700}
.tag{color:var(--muted);font-size:13px;font-weight:600}
.desc{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tags span{font-size:11px;font-weight:600;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.play{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:12px;background:linear-gradient(180deg,#d8b66d,#b48d45);color:#16130d;font-weight:700}
.soon{border:1px dashed var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px;min-height:120px;text-align:center;padding:20px}
.bar{display:flex;justify-content:center;gap:10px;margin:30px 0 8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid rgba(201,164,92,.45);background:var(--panel);color:var(--gold2);font:600 14px var(--sans);cursor:pointer}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:18px;line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1dca6"/><stop offset="1" stop-color="#b48d45"/></linearGradient></defs>
      <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="url(#lg)" stroke-width="2"/>
      <text x="32" y="43" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="30" font-weight="600" fill="url(#lg)">H</text>
    </svg>
    <div class="word">H-LUX</div>
    <div class="sub">COLEÇÃO DE JOGOS</div>
    <div class="rule"></div>
  </header>

  <h2>Jogos</h2>
  <main class="grid" id="catalog"></main>

  <div class="bar"><button class="btn hidden" id="install">Instalar H-LUX como app</button></div>
  <div class="foot">Cada jogo salva o próprio progresso neste dispositivo e funciona offline depois do primeiro acesso.<br>Nenhuma imagem pessoal é enviada para servidores.</div>
</div>

<script src="games.js"></script>
<script>
'use strict';
(function () {
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hub = id => { try { return JSON.parse(localStorage.getItem('hlux.hub.' + id) || 'null'); } catch (e) { return null; } };
  const games = window.HLUX_GAMES || [];
  const cat = document.getElementById('catalog');
  cat.innerHTML = games.map(g => {
    const h = hub(g.id);
    return `<a class="card" href="${esc(g.path)}" data-game="${esc(g.id)}">
      <div class="cover" style="background-image:url('${esc(g.cover)}')">${h && h.line ? `<div class="status"><span class="pill">${esc(h.line)}</span></div>` : ''}</div>
      <div class="body">
        <div class="name"><b>${esc(g.name)}</b><small>H-LUX</small></div>
        <div class="tag">${esc(g.tagline)}</div>
        <p class="desc">${esc(g.description)}</p>
        <div class="tags">${(g.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
        <span class="play">${h && h.line ? 'Continuar' : 'Jogar'}</span>
      </div></a>`;
  }).join('') + `<div class="soon">Novos jogos chegam aqui.<br>A plataforma foi feita para crescer.</div>`;

  // Instalação como app (Android/Chrome/Edge)
  let deferred = null; const ib = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; ib.classList.remove('hidden'); });
  ib.addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; ib.classList.add('hidden'); });
  window.addEventListener('appinstalled', () => ib.classList.add('hidden'));

  try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {}); } catch (e) {}
})();
</script>
</body>
</html>
