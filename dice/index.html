<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120a0a">
<title>H-LUX Dice</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
:root{--bg:#120a0a;--bg2:radial-gradient(ellipse at 50% 0%,#3a1717 0%,#120a0a 64%);--d:54px}
.wrap{display:flex;flex-direction:column;width:100%;height:100%;gap:8px}
.tray{display:flex;gap:8px;justify-content:center;padding:6px 0}
.die{width:var(--d);height:var(--d);border-radius:calc(var(--d)*.2);background:linear-gradient(160deg,#fff,#e8dfcb);box-shadow:0 4px 0 #8a6a32,0 8px 14px rgba(0,0,0,.45);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:calc(var(--d)*.14);border:0;position:relative;transition:transform .15s}
.die i{width:calc(var(--d)*.16);height:calc(var(--d)*.16);border-radius:50%;background:#1a1408;place-self:center;visibility:hidden}
.die i.v{visibility:visible}
.die.held{transform:translateY(-8px);box-shadow:0 0 0 3px #f1dca6,0 4px 0 #8a6a32,0 10px 18px rgba(0,0,0,.5)}
.die.held::after{content:'GUARDADO';position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:1px;color:var(--accent2)}
.die.blank{background:#2a2020;box-shadow:inset 0 0 0 2px rgba(201,164,92,.3)}
.die.roll{animation:roll .5s ease}@keyframes roll{30%{transform:rotate(-25deg) scale(.85)}70%{transform:rotate(15deg)}}
.act{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px}
.act .btn-primary{width:auto;min-height:48px;padding:0 24px}
.msg{font-size:13px;font-weight:800;color:var(--accent2);text-align:center;min-height:18px}
.sheet{flex:1;overflow:auto;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid #26221c;text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-weight:700;color:var(--text)}
thead th{position:sticky;top:0;background:#1d1a16;font-size:11px;letter-spacing:.6px;color:var(--muted);z-index:1}
thead th.on{color:var(--accent2)}
td.c{cursor:pointer;color:var(--accent2);font-weight:800;background:rgba(201,164,92,.08)}
td.c.zero{color:#9a6c6c}
td.c:hover{background:rgba(201,164,92,.2)}
td.f{color:var(--text);font-weight:700}
tr.sum td{color:var(--muted);font-weight:700;background:#191612}
tr.tot td{color:var(--accent2);font-weight:800;font-size:14px;background:#1d1a14}
td small{display:block;font-size:9.5px;color:var(--muted);font-weight:600}
.cover{position:fixed;inset:0;background:#120a0a;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.cover h2{font-family:'Cormorant Garamond',serif;color:var(--accent2);font-size:30px;margin:0}
</style>
</head>
<body>
<div class="app">
  <div class="top"><a class="back" href="../" data-platform-link><svg class="i"><path d="M14.5 6l-6 6 6 6"/></svg>H-LUX</a><div class="title">Di<b>ce</b></div><button class="ib" id="menu" aria-label="Menu"><svg class="i"><path d="M4.5 7h15M4.5 12h15M4.5 17h15"/></svg></button></div>
  <div class="hud"><div class="sc"><small>Rodada</small><b id="rd">1/13</b></div><div class="sc"><small>Vez</small><b id="who">—</b></div><div class="sc"><small>Lances</small><b id="rolls">3</b></div><div class="sc"><small>Recorde</small><b id="best">0</b></div></div>
  <div class="stage" id="stage" style="align-items:stretch"><div class="wrap"><div class="tray" id="tray"></div><div class="act"><button class="btn-primary" id="roll">Lançar dados</button></div><div class="msg" id="msg"></div><div class="sheet"><table id="tab"></table></div></div></div>
  <div class="tools">
    <button class="tool" id="t-hist"><svg class="i"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Histórico</button>
    <button class="tool" id="t-rules"><svg class="i"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>Regras</button>
    <button class="tool" id="t-snd"><svg class="i"><path d="M4 9v6h4l5 4V5L8 9z"/></svg><span id="sndl">Som</span></button>
    <button class="tool" id="t-new"><svg class="i"><path d="M12 5v14M5 12h14"/></svg>Nova</button>
  </div>
</div>
<script src="../shared/kit.js"></script>
<script>
'use strict';
/* H-LUX DICE v1.0 — variante tradicional de 5 dados e 13 categorias (nomes e visual do H-LUX).
   Até 3 lançamentos por vez, guardando os dados que quiser. Bônus de 35 com 63+ na parte de cima.
   Solo ou até 4 participantes (humanos ou IA) no mesmo aparelho. Módulos: Rules · AI · Game · View · UI */
const S = HX.store('dice');
const CATS = [
  { k: 'n1', n: 'Uns', up: 1 }, { k: 'n2', n: 'Dois', up: 2 }, { k: 'n3', n: 'Três', up: 3 }, { k: 'n4', n: 'Quatros', up: 4 }, { k: 'n5', n: 'Cincos', up: 5 }, { k: 'n6', n: 'Seis', up: 6 },
  { k: 'tri', n: 'Trinca', d: 'soma dos dados' }, { k: 'qua', n: 'Quadra', d: 'soma dos dados' }, { k: 'full', n: 'Full', d: '25 pontos' }, { k: 'sq4', n: 'Sequência de 4', d: '30 pontos' }, { k: 'sq5', n: 'Sequência de 5', d: '40 pontos' }, { k: 'lux', n: 'Cinco iguais', d: '50 pontos' }, { k: 'ch', n: 'Livre', d: 'soma dos dados' }
];
const Rules = {
  counts(d) { const c = Array(7).fill(0); d.forEach(v => c[v]++); return c; },
  score(k, d) {
    const c = this.counts(d), sum = d.reduce((a, b) => a + b, 0), mx = Math.max(...c), has = n => c[n] > 0;
    const run = len => { for (let s = 1; s + len - 1 <= 6; s++) { let ok = true; for (let v = s; v < s + len; v++) if (!has(v)) ok = false; if (ok) return true; } return false; };
    switch (k) {
      case 'tri': return mx >= 3 ? sum : 0; case 'qua': return mx >= 4 ? sum : 0; case 'full': return c.includes(3) && c.includes(2) ? 25 : 0;
      case 'sq4': return run(4) ? 30 : 0; case 'sq5': return run(5) ? 40 : 0; case 'lux': return mx === 5 ? 50 : 0; case 'ch': return sum;
      default: { const n = +k.slice(1); return c[n] * n; }
    }
  },
  upper(sh) { return CATS.filter(c => c.up).reduce((s, c) => s + (sh[c.k] || 0), 0); },
  bonus(sh) { return this.upper(sh) >= 63 ? 35 : 0; },
  total(sh) { return CATS.reduce((s, c) => s + (sh[c.k] || 0), 0) + this.bonus(sh); }
};
const AI = {
  // escolhe a melhor categoria livre (valor esperado simples com pesos)
  best(d, sh, rollsLeft) {
    let best = null, bv = -Infinity; const up = Rules.upper(sh);
    for (const c of CATS) { if (sh[c.k] !== undefined) continue; const s = Rules.score(c.k, d); let v = s;
      if (c.up) { v = s - c.up * 3 + (up < 63 && s >= c.up * 3 ? 8 : 0); }
      if (c.k === 'ch') v = s - 22; if (c.k === 'lux' && !s) v = -12; if (c.k === 'sq5' && !s) v = -9; if (c.k === 'full' && !s) v = -7; if (c.k === 'qua' && !s) v = -4;
      if (v > bv) { bv = v; best = c.k; } }
    return { k: best, v: bv };
  },
  holds(d, sh) {
    const c = Rules.counts(d); const free = k => sh[k] === undefined;
    const set = new Set(d);
    // sequência quase pronta
    for (const s of [[1, 2, 3, 4, 5], [2, 3, 4, 5, 6]]) if ((free('sq5') || free('sq4')) && s.filter(v => set.has(v)).length >= 4) { const used = new Set(); return d.map(v => s.includes(v) && !used.has(v) ? (used.add(v), true) : false); }
    for (const s of [[1, 2, 3, 4], [2, 3, 4, 5], [3, 4, 5, 6]]) if (free('sq4') && s.every(v => set.has(v))) { const used = new Set(); return d.map(v => s.includes(v) && !used.has(v) ? (used.add(v), true) : false); }
    if (free('full') && c.includes(3) && c.includes(2)) return d.map(() => true);
    // guarda o valor mais repetido (preferindo os altos)
    let bestV = 6, bc = 0; for (let v = 6; v >= 1; v--) if (c[v] > bc) { bc = c[v]; bestV = v; }
    if (bc === 1) { bestV = Math.max(...d); return d.map(v => v >= 5 && v === bestV && d.indexOf(v) === d.indexOf(bestV)); }
    return d.map(v => v === bestV);
  }
};
const Game = {
  cfg: null, sheets: [], turn: 0, round: 1, dice: [0, 0, 0, 0, 0], held: [false, false, false, false, false], rolls: 0, done: false, viewer: 0, busy: false, log: [],
  n() { return this.cfg.who.length; }, isAI(p) { return this.cfg.who[p] === 'ai'; }, humans() { return this.cfg.who.filter(w => w === 'h').length; },
  newGame(cfg) { HX.close(); this.cfg = cfg; this.sheets = cfg.who.map(() => ({})); this.turn = 0; this.round = 1; this.done = false; this.log = []; this.viewer = 0; this.startTurn(); },
  startTurn() {
    this.dice = [0, 0, 0, 0, 0]; this.held = [false, false, false, false, false]; this.rolls = 0; this.save(); View.render();
    if (!this.isAI(this.turn) && this.humans() > 1 && this.viewer !== this.turn) { this.viewer = this.turn; return UI.cover(`Vez de ${UI.nm(this.turn)}`, 'Passe o aparelho para o próximo jogador.', () => View.render()); }
    UI.msg(this.isAI(this.turn) ? `${UI.nm(this.turn)} está jogando…` : 'Lance os dados'); if (this.isAI(this.turn)) this.aiStep();
  },
  roll(instant) {
    if (!this.cfg || this.done || this.rolls >= 3 || this.busy) return; if (this.rolls && this.held.every(Boolean)) return HX.toast('Solte algum dado para lançar de novo');
    this.dice = this.dice.map((v, i) => this.held[i] && this.rolls ? v : 1 + Math.floor(Math.random() * 6)); if (this.forced) { this.dice = this.forced; this.forced = null; }
    this.rolls++; HX.sfx('dice'); HX.vibrate(10); this.save(); View.render(!instant);
    UI.msg(this.isAI(this.turn) ? `${UI.nm(this.turn)} lançou` : this.rolls < 3 ? 'Toque nos dados para guardar, lance de novo ou escolha uma categoria' : 'Escolha uma categoria na tabela');
  },
  toggle(i) { if (this.done || !this.rolls || this.rolls >= 3 || this.isAI(this.turn) || this.busy) return; this.held[i] = !this.held[i]; HX.sfx('tap'); View.render(); this.save(); },
  pick(k) {
    if (this.done || !this.rolls || this.busy) return; const sh = this.sheets[this.turn]; if (sh[k] !== undefined) return;
    const v = Rules.score(k, this.dice); sh[k] = v; this.log.push({ p: this.turn, r: this.round, d: this.dice.slice(), k, v });
    HX.sfx(v ? (v >= 30 ? 'win' : 'coin') : 'hit'); if (k === 'lux' && v) { HX.toast('Cinco iguais! +50'); HX.vibrate(40); }
    this.turn = (this.turn + 1) % this.n(); if (this.turn === 0) this.round++;
    if (this.round > 13) return this.finish();
    this.busy = true; View.render(); setTimeout(() => { this.busy = false; this.startTurn(); }, this.isAI(this.turn) ? 500 : 250);
  },
  aiStep() {
    this.busy = true; const lvl = this.cfg.diff;
    const go = () => {
      this.busy = false; this.roll(); this.busy = true;
      setTimeout(() => {
        const sh = this.sheets[this.turn], b = AI.best(this.dice, sh, 3 - this.rolls);
        const stop = this.rolls >= 3 || (lvl !== 'facil' && b.v >= 20) || (lvl === 'facil' && Math.random() < .4);
        if (stop) { this.busy = false; let k = b.k; if (lvl === 'facil' && Math.random() < .25) { const fr = CATS.filter(c => sh[c.k] === undefined); k = fr[Math.floor(Math.random() * fr.length)].k; } return this.pick(k); }
        this.held = AI.holds(this.dice, sh); View.render(); setTimeout(go, 650);
      }, 700);
    };
    setTimeout(go, 500);
  },
  finish() {
    this.done = true; const tot = this.sheets.map(sh => Rules.total(sh)), best = Math.max(...tot), win = tot.map((t, p) => t === best ? p : -1).filter(p => p >= 0);
    const st = S.get('stats', { games: 0, best: 0, hist: [] }); st.games++;
    this.cfg.who.forEach((w, p) => { if (w === 'h') st.best = Math.max(st.best, tot[p]); });
    st.hist.unshift({ date: new Date().toLocaleDateString('pt-BR'), scores: tot, who: this.cfg.who, names: this.cfg.who.map((_, p) => UI.nm(p)) }); st.hist = st.hist.slice(0, 20); S.set('stats', st);
    S.del('cur'); S.hub(null); View.render(); HX.sfx('win'); setTimeout(() => UI.end(tot, win), 700);
  },
  save() { if (this.done) return; S.set('cur', { cfg: this.cfg, sheets: this.sheets, turn: this.turn, round: this.round, dice: this.dice, held: this.held, rolls: this.rolls, log: this.log }); S.hub(`Em andamento · rodada ${this.round}/13 · ${Rules.total(this.sheets[Math.max(0, this.cfg.who.indexOf('h'))] || {})} pts`); },
  load() { const c = S.get('cur', null); if (!c || !c.cfg) return false; Object.assign(this, { cfg: c.cfg, sheets: c.sheets, turn: c.turn, round: c.round, dice: c.dice, held: c.held, rolls: c.rolls, log: c.log || [], done: false, busy: false, viewer: c.turn }); return true; }
};
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const View = {
  render(anim) {
    if (!Game.cfg) return; const st = HX.$('#stage'); const d = Math.max(42, Math.min(72, Math.floor((st.clientWidth - 48) / 5.4))); document.documentElement.style.setProperty('--d', d + 'px');
    HX.$('#tray').innerHTML = Game.dice.map((v, i) => `<button class="die ${v ? '' : 'blank'} ${Game.held[i] && Game.rolls ? 'held' : ''} ${anim && !(Game.held[i] && Game.rolls > 1) ? 'roll' : ''}" data-i="${i}" aria-label="Dado ${i + 1}">${Array.from({ length: 9 }, (_, k) => `<i class="${v && PIPS[v].includes(k) ? 'v' : ''}"></i>`).join('')}</button>`).join('');
    const p = Game.turn, me = !Game.isAI(p) && !Game.done, canPick = me && Game.rolls > 0 && !Game.busy;
    const cols = Game.cfg.who.map((_, q) => q);
    let h = `<thead><tr><th>Categoria</th>${cols.map(q => `<th class="${q === p && !Game.done ? 'on' : ''}">${HX.esc(UI.nm(q, true))}</th>`).join('')}</tr></thead><tbody>`;
    const row = c => `<tr><td>${c.n}${c.d ? `<small>${c.d}</small>` : ''}</td>${cols.map(q => { const v = Game.sheets[q][c.k]; if (v !== undefined) return `<td class="f">${v}</td>`; if (q === p && canPick) { const s = Rules.score(c.k, Game.dice); return `<td class="c ${s ? '' : 'zero'}" data-k="${c.k}">${s}</td>`; } return '<td>·</td>'; }).join('')}</tr>`;
    h += CATS.filter(c => c.up).map(row).join('');
    h += `<tr class="sum"><td>Parte de cima<small>bônus +35 com 63</small></td>${cols.map(q => `<td>${Rules.upper(Game.sheets[q])}${Rules.bonus(Game.sheets[q]) ? ' +35' : ''}</td>`).join('')}</tr>`;
    h += CATS.filter(c => !c.up).map(row).join('');
    h += `<tr class="tot"><td>Total</td>${cols.map(q => `<td>${Rules.total(Game.sheets[q])}</td>`).join('')}</tr></tbody>`;
    HX.$('#tab').innerHTML = h;
    const b = HX.$('#roll'); b.textContent = Game.rolls === 0 ? 'Lançar dados' : Game.rolls < 3 ? `Lançar de novo (${3 - Game.rolls})` : 'Escolha uma categoria'; b.disabled = !me || Game.rolls >= 3 || Game.busy;
    HX.$('#rd').textContent = `${Math.min(13, Game.round)}/13`; HX.$('#who').textContent = UI.nm(p, true); HX.$('#rolls').textContent = 3 - Game.rolls; HX.$('#best').textContent = S.get('stats', { best: 0 }).best;
  }
};
const UI = {
  init() {
    HX.$('#tray').addEventListener('click', e => { const d = e.target.closest('.die'); if (d) Game.toggle(+d.dataset.i); });
    HX.$('#tab').addEventListener('click', e => { const td = e.target.closest('td.c'); if (!td || HX.isOpen()) return; const k = td.dataset.k, v = Rules.score(k, Game.dice);
      if (!v && Game.rolls < 3) { const c = HX.overlay(`<h3>Marcar zero?</h3><p>${CATS.find(x => x.k === k).n} vale 0 com estes dados. Ainda dá para lançar de novo.</p><div class="row2"><button class="btn" id="no">Voltar</button><button class="btn-primary" id="yes">Marcar 0</button></div>`, { guard: false }); HX.on(c, '#no', () => HX.close()); HX.on(c, '#yes', () => { HX.close(); Game.pick(k); }); return; }
      Game.pick(k); });
    HX.$('#roll').onclick = () => Game.roll(); HX.$('#t-new').onclick = () => this.setup(); HX.$('#menu').onclick = () => this.menu(); HX.$('#t-rules').onclick = () => HX.help('Regras', this.helpItems); HX.$('#t-hist').onclick = () => this.hist();
    HX.$('#t-snd').onclick = () => { HX.sound(!HX.sound()); HX.$('#sndl').textContent = HX.sound() ? 'Som' : 'Mudo'; }; HX.$('#sndl').textContent = HX.sound() ? 'Som' : 'Mudo';
    addEventListener('keydown', e => { if (HX.isOpen()) return; if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); Game.roll(); } const n = +e.key; if (n >= 1 && n <= 5) Game.toggle(n - 1); });
    new ResizeObserver(() => View.render()).observe(HX.$('#stage'));
    HX.life({ onHide: () => Game.cfg && Game.save() });
    if (Game.load()) { View.render(); HX.toast('Partida retomada'); if (Game.isAI(Game.turn)) Game.startTurn(); } else this.setup();
  },
  nm(p, short) { const w = Game.cfg.who[p]; if (w === 'ai') return short ? `IA ${p + 1}` : `IA ${p + 1}`; return Game.humans() > 1 ? (short ? `J${p + 1}` : `Jogador ${p + 1}`) : 'Você'; },
  msg(t) { HX.$('#msg').textContent = t; },
  helpItems: ['Variante tradicional de 5 dados com 13 categorias. A partida tem 13 rodadas; em cada uma, cada participante preenche exatamente uma categoria.', 'Na sua vez, lance até 3 vezes. Entre os lances, toque nos dados para guardá-los (ficam marcados) e lance só os outros.', 'Toque numa casa da sua coluna para marcar os pontos mostrados. Uma categoria preenchida não pode ser trocada; às vezes vale a pena marcar 0.', 'Parte de cima: soma dos dados do número indicado. Com 63 ou mais nessas seis, ganha +35.', 'Trinca e Quadra: 3 ou 4 dados iguais valem a soma de todos. Full (3 + 2 iguais): 25. Sequência de 4: 30. Sequência de 5: 40. Cinco iguais: 50. Livre: soma de qualquer jogada.', 'Teclado: espaço lança, 1 a 5 guardam os dados.'],
  setup() {
    const pc = S.get('cfg', null), v = { p1: 'off', p2: 'off', p3: 'off', diff: 'medio' }; if (pc) { pc.who.slice(1).forEach((w, i) => v['p' + (i + 1)] = w); v.diff = pc.diff; }
    HX.setup({ title: 'Dice', text: 'Jogue sozinho ou com até 3 adversários.', values: v,
      groups: [1, 2, 3].map(p => ({ key: 'p' + p, label: `Participante ${p + 1}`, opts: [['off', 'Ninguém'], ['ai', 'IA'], ['h', 'Humano']] })).concat([{ key: 'diff', label: 'Dificuldade da IA', opts: [['facil', 'Fácil'], ['medio', 'Médio']], show: x => [x.p1, x.p2, x.p3].includes('ai') }]),
      start: 'Começar', help: this.helpItems,
      onStart: x => { const who = ['h', x.p1, x.p2, x.p3].filter(w => w !== 'off'); const cfg = { who, diff: x.diff }; S.set('cfg', cfg); S.del('cur'); Game.newGame(cfg); } });
  },
  cover(title, text, go) { HX.close(); const d = document.createElement('div'); d.className = 'cover'; d.innerHTML = `<h2>${title}</h2><p>${text}</p><button class="btn-primary" style="max-width:320px">Pronto</button>`; document.body.appendChild(d); d.querySelector('button').onclick = () => { d.remove(); go(); UI.msg('Lance os dados'); }; },
  hist() { const st = S.get('stats', { games: 0, best: 0, hist: [] }); const c = HX.overlay(`<h3>Histórico</h3><div class="kv"><div><b>${st.games}</b><small>Partidas</small></div><div><b>${st.best}</b><small>Recorde</small></div></div><div class="hist">${st.hist.length ? `<ol>${st.hist.map(g => `<li>${g.date}: ${g.names.map((n, i) => `${HX.esc(n)} ${g.scores[i]}`).join(' · ')}</li>`).join('')}</ol>` : 'Nenhuma partida terminada ainda.'}</div><button class="btn-primary" id="ok">Fechar</button>`, { guard: false, dismiss: () => {} }); HX.on(c, '#ok', () => HX.close()); },
  menu() { const c = HX.overlay(`<h3>Dice</h3><p>Rodada ${Math.min(13, Game.round)} de 13</p><button class="btn-primary" id="cl">Continuar</button><button class="btn" id="nw">Nova partida</button><div class="row2"><button class="btn" id="hs">Histórico</button><button class="btn" id="hw">Regras</button></div>`, { guard: false, dismiss: () => {} });
    HX.on(c, '#cl', () => HX.close()); HX.on(c, '#nw', () => this.setup()); HX.on(c, '#hs', () => this.hist()); HX.on(c, '#hw', () => HX.help('Regras', this.helpItems)); },
  end(tot, win) {
    const st = S.get('stats', { best: 0 }); const solo = Game.n() === 1, me = Game.cfg.who.indexOf('h');
    const head = solo ? `${tot[0]} pontos` : win.length > 1 ? 'Empate!' : Game.humans() === 1 ? (win[0] === me ? 'Você venceu!' : `${this.nm(win[0])} venceu`) : `${this.nm(win[0])} venceu!`;
    const c = HX.overlay(`<h3>${head}</h3><p>${solo && tot[0] >= st.best ? 'Novo recorde!' : `Recorde: ${st.best}`}</p><div class="hist"><ol>${tot.map((t, p) => `<li>${HX.esc(this.nm(p))}: ${t} pts</li>`).join('')}</ol></div><button class="btn-primary" id="ag">Jogar de novo</button><div class="row2"><button class="btn" id="bd">Ver tabela</button><button class="btn" id="nw">Mudar participantes</button></div>`);
    HX.on(c, '#ag', () => Game.newGame(Game.cfg)); HX.on(c, '#bd', () => HX.close()); HX.on(c, '#nw', () => this.setup());
  }
};
UI.init(); HX.sw();
window.DC = { Rules, AI, Game, View, UI, S, CATS };
</script>
</body>
</html>
