/* H-LUX POOL v2.0 — sinuca bola 8 no padrão do 8 Ball Pool.

  help: ['Mirar: arraste o dedo na mesa (a mira gira em torno da branca; quanto mais longe da branca, mais preciso) ou toque num ponto para apontar. ⟲ ⟳ fazem ajuste fino — segure para girar devagar. No PC: o mouse mira, as setas ajustam (Shift = rápido).', 'Tacar: puxe o taco na barra (da direita para a esquerda) — quanto mais puxar, mais forte — e solte. No PC: segure espaço e solte.', 'Efeito (botão da bola branca): alto faz a branca seguir, baixo faz voltar, lateral abre o ângulo ao bater na tabela. A guia mostra a bola-fantasma, a direção da bola alvo (verde = pode, vermelho = proibida) e o desvio da branca (tracejado).', 'Regras bola 8: depois da quebra, a primeira bola encaçapada legalmente define seu grupo. Encaçapou do seu grupo, joga de novo. Faltas — branca na caçapa, não tocar em nada, tocar primeiro na bola errada, nenhuma bola na tabela após o contato ou estourar os 30 s — dão bola na mão ao adversário (arraste a branca para onde quiser).', 'Para a bola 8 é preciso cantar a caçapa (toque nela antes de tacar). Vence quem encaçapar a 8 na caçapa cantada depois de limpar o grupo; 8 antes da hora, na caçapa errada ou com falta é derrota. A 8 na quebra volta à mesa.'],
  home() { const st = S.get('stats', { w: 0, l: 0 });
    HXA.menu({ title: 'Pool', text: 'Sinuca bola 8.', stats: [[st.w, 'Vitórias'], [st.l, 'Derrotas']], html: `<div class="seg" id="lv">${['IA fácil', 'IA média', 'IA difícil'].map((n, i) => `<button data-v="${i}" class="${i === (this.lv ?? 1) ? 'on' : ''}">${n}</button>`).join('')}</div>`,
      primary: ['Jogar contra a IA', () => Game.start('ai', this.lv ?? 1)], buttons: [['2 jogadores (mesmo aparelho)', () => Game.start('pvp')]], help: this.help });
    document.querySelectorAll('#lv [data-v]').forEach(b => b.onclick = () => { this.lv = +b.dataset.v; document.querySelectorAll('#lv button').forEach(x => x.classList.toggle('on', x === b)); }); },
  pause() { if (Game.state === 'idle' || Game.state === 'over') return this.home(); HXA.menu({ title: 'Pausa', text: Game.msg || '', primary: ['Continuar', () => {}], buttons: [['Nova partida', () => Game.start()], ['Menu', () => this.home()]] }); }
};
UI.init(); HX.sw();
window.PL = { Game, UI, S, Rules, AI, Phys, Table };

</script>
