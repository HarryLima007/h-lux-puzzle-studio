<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08161a">
<title>H-LUX Arrow</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
:root{--bg:#08161a;--bg2:radial-gradient(ellipse at 50% 0%,#12363d 0%,#08161a 62%);--panel:#0e2328;--panel2:#143038;--line:#1f454e;--muted:#8db3b8;--a:44px}
body{touch-action:manipulation}
.board{position:relative;flex:none}
.cell{position:absolute;width:var(--a);height:var(--a);border-radius:10px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.arr{position:absolute;width:var(--a);height:var(--a);display:grid;place-items:center;cursor:pointer;transition:transform .45s cubic-bezier(.5,0,.8,.4),opacity .45s}
.arr svg{width:72%;height:72%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.arr .bg{position:absolute;inset:3px;border-radius:10px;background:linear-gradient(160deg,#f5efe2,#d8ccb2);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,0,0,.18)}
.arr svg{position:relative}
.arr.gone{opacity:0}
.arr.bump{animation:bump .35s ease}
@keyframes bump{30%{translate:var(--bx) var(--by)}60%{translate:calc(var(--bx) * -.3) calc(var(--by) * -.3)}}
.arr.bump .bg{background:linear-gradient(160deg,#ffb3a8,#e5604f)}
.arr.hint .bg{box-shadow:0 0 0 3px #e8cd8c,0 0 16px #e8cd8c}
.hearts{font-size:18px;letter-spacing:2px;color:#e5604f}
.lvwrap{max-height:52vh;overflow:auto;padding:2px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><a class="back" href="../" data-platform-link><svg class="i"><path d="M14.5 6l-6 6 6 6"/></svg>H-LUX</a><div class="title">Ar<b>row</b></div><button class="ib" id="menu" aria-label="Menu"><svg class="i"><path d="M4.5 7h15M4.5 12h15M4.5 17h15"/></svg></button></div>
  <div class="hud"><div class="sc"><small>Fase</small><b id="lv">1</b></div><div class="sc"><small>Vidas</small><b class="hearts" id="hearts">♥♥♥</b></div><div class="sc"><small>Setas</small><b id="left">0</b></div><div class="sc"><small>Tempo</small><b id="time">0:00</b></div></div>
  <div class="stage" id="stage"><div class="board" id="board"></div></div>
  <div class="tools">
    <button class="tool" id="t-reset"><svg class="i"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4h4"/></svg>Reiniciar</button>
    <button class="tool" id="t-hint"><svg class="i"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>Dica<span class="badge" id="b-hint"></span></button>
    <button class="tool" id="t-levels"><svg class="i"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/></svg>Fases</button>
  </div>
</div>
<script src="../shared/kit.js"></script>
<script>
'use strict';
/* H-LUX ARROW v1.0 — tire as setas na ordem certa
   Fases geradas por construção reversa (sempre solucionáveis) e conferidas por um resolvedor.
   Módulos: Shapes · Gen · Rules · Game · View · UI */
const S = HX.store('arrow');
const D = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // cima, direita, baixo, esquerda
/* ---------- Formatos de tabuleiro ---------- */
const SHAPES = {
  square: (x, y, n) => true,
  diamond: (x, y, n) => Math.abs(x - (n - 1) / 2) + Math.abs(y - (n - 1) / 2) <= (n - 1) / 2 + .01,
  cross: (x, y, n) => { const t = Math.floor(n / 3); return (x >= t && x < n - t) || (y >= t && y < n - t); },
  ring: (x, y, n) => { const c = (n - 1) / 2, d = Math.max(Math.abs(x - c), Math.abs(y - c)); return d >= Math.max(1, n / 6); },
  heart: (x, y, n) => { const X = (x - (n - 1) / 2) / (n / 2.1), Y = -((y - (n - 1) / 2) / (n / 2.1)) + .25; return (X * X + Y * Y - 1) ** 3 - X * X * Y ** 3 <= .02; },
  triangle: (x, y, n) => Math.abs(x - (n - 1) / 2) <= y * .55 + .5,
  hshape: (x, y, n) => x < Math.ceil(n / 3) || x >= n - Math.ceil(n / 3) || (y >= Math.floor(n / 3) && y < n - Math.floor(n / 3)),
  wave: (x, y, n) => Math.abs(y - (n - 1) / 2 - Math.sin(x / (n - 1) * Math.PI * 2) * n / 5) <= n / 3.2,
  checker: (x, y, n) => ((Math.floor(x / 2) + Math.floor(y / 2)) % 2 === 0) || (x + y) % 3 === 0,
  frame: (x, y, n) => x < 2 || y < 2 || x >= n - 2 || y >= n - 2 || (x === y) || (x === n - 1 - y)
};
const ORDER = ['square', 'diamond', 'cross', 'triangle', 'heart', 'ring', 'hshape', 'wave', 'frame', 'checker'];
const LEVELS = Array.from({ length: 30 }, (_, k) => ({ n: Math.min(9, 4 + Math.floor(k / 4)), shape: k < 2 ? 'square' : ORDER[k % ORDER.length], seed: 500 + k * 131, inward: Math.min(.85, .35 + k * .02) }));

/* ---------- Rules ---------- */
const Rules = {
  ray(grid, n, x, y, d) { const out = []; let cx = x + D[d][0], cy = y + D[d][1]; while (cx >= 0 && cy >= 0 && cx < n && cy < n) { out.push(cy * n + cx); cx += D[d][0]; cy += D[d][1]; } return out; },
  free(grid, n, i) { const d = grid[i]; if (d < 0) return false; return this.ray(grid, n, i % n, Math.floor(i / n), d).every(j => grid[j] < 0); },
  blocker(grid, n, i) { const d = grid[i]; return this.ray(grid, n, i % n, Math.floor(i / n), d).find(j => grid[j] >= 0); },
  // remover qualquer seta livre nunca atrapalha as outras → resolvível se o guloso esvaziar o tabuleiro
  solvable(grid, n) { const g = grid.slice(); for (;;) { let moved = false; for (let i = 0; i < g.length; i++) if (g[i] >= 0 && this.free(g, n, i)) { g[i] = -1; moved = true; } if (!moved) break; } return g.every(v => v < 0); }
};

/* ---------- Gen: construção reversa ---------- */
const Gen = {
  make(L) {
    const n = L.n, rnd = HX.rng(L.seed), cells = [];
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (SHAPES[L.shape](x, y, n)) cells.push(y * n + x);
    for (let t = 0; t < 80; t++) {
      // de dentro para fora: a seta mais interna entra primeiro (sai por último). Quem está mais perto da borda
      // sempre tem a direção dessa borda livre, então a construção sempre fecha. O ruído varia as fases.
      const depth = i => Math.min(i % n, Math.floor(i / n), n - 1 - i % n, n - 1 - Math.floor(i / n));
      const noise = t < 60 ? 1.6 : 0;
      const order = cells.map(i => [i, depth(i) + rnd() * noise]).sort((a, b) => b[1] - a[1]).map(e => e[0]);
      const grid = new Array(n * n).fill(-1); let pending = order, guard = 0;
      // cada seta adicionada precisa ter caminho livre entre as já colocadas (que sairão depois dela)
      while (pending.length && guard++ < 50) {
        const next = [];
        for (const i of pending) {
          const x = i % n, y = Math.floor(i / n), ok = [0, 1, 2, 3].filter(d => Rules.ray(grid, n, x, y, d).every(j => grid[j] < 0));
          if (!ok.length) { next.push(i); continue; }
          // preferir apontar para dentro do desenho (mais dependências = mais desafio)
          const score = d => Rules.ray(grid, n, x, y, d).filter(j => cells.includes(j)).length;
          ok.sort((a, b) => score(b) - score(a));
          grid[i] = rnd() < L.inward ? ok[0] : ok[Math.floor(rnd() * ok.length)];
        }
        if (next.length === pending.length) break; pending = next;
      }
      if (!pending.length && Rules.solvable(grid, n)) return grid;
    }
    return null;
  }
};

/* ---------- Game ---------- */
const Game = {
  lv: 0, n: 4, grid: null, start0: null, hearts: 3, hints: 3, moves: 0, done: false, timer: HX.timer(),
  start(k) {
    this.lv = k; const L = LEVELS[k]; this.n = L.n; this.start0 = Gen.make(L); this.grid = this.start0.slice();
    this.hearts = 3; this.hints = 3; this.moves = 0; this.done = false; this.timer.stop(); this.timer.set(0);
    HX.close(); View.build(); UI.hud(); S.hub(`Fase ${k + 1} em andamento`);
  },
  tap(i) {
    if (this.done || this.grid[i] < 0) return;
    if (!this.timer.running) this.timer.start(() => UI.hud());
    if (Rules.free(this.grid, this.n, i)) { const d = this.grid[i]; this.grid[i] = -1; this.moves++; View.fly(i, d); UI.hud(); if (this.grid.every(v => v < 0)) this.win(); }
    else { this.hearts--; View.bump(i, this.grid[i]); HX.vibrate(40); UI.hud(); if (this.hearts <= 0) this.lose(); }
  },
  hint() { if (this.done) return; if (this.hints <= 0) return HX.toast('Sem dicas nesta fase'); const f = this.grid.map((v, i) => i).filter(i => this.grid[i] >= 0 && Rules.free(this.grid, this.n, i)); if (!f.length) return; this.hints--; View.hint(f[Math.floor(Math.random() * f.length)]); UI.hud(); },
  win() {
    this.done = true; this.timer.stop(); const stars = this.hearts === 3 ? 3 : this.hearts === 2 ? 2 : 1;
    const p = S.get('progress', { unlocked: 0, levels: {} }), prev = p.levels[this.lv], t = this.timer.ms;
    p.levels[this.lv] = { stars: Math.max(prev ? prev.stars : 0, stars), best: prev ? Math.min(prev.best, t) : t };
    p.unlocked = Math.max(p.unlocked, Math.min(this.lv + 1, LEVELS.length - 1)); S.set('progress', p); S.hub(`Fase ${p.unlocked + 1} de ${LEVELS.length}`);
    setTimeout(() => UI.win(stars), 500);
  },
  lose() { this.done = true; this.timer.stop(); setTimeout(() => UI.lose(), 500); }
};

/* ---------- View ---------- */
const ARROW = '<svg viewBox="0 0 24 24"><path d="M12 3l7 8h-4.5v10h-5V11H5z" fill="#1d4b52"/></svg>';
const View = {
  els: {}, a: 44,
  size() { const st = HX.$('#stage'), n = Game.n; this.a = Math.floor(Math.min((st.clientWidth - 10) / n, (st.clientHeight - 10) / n, 70)); document.documentElement.style.setProperty('--a', this.a + 'px'); const b = HX.$('#board'); b.style.width = b.style.height = this.a * n + 'px'; this.layout(); },
  build() {
    const b = HX.$('#board'), n = Game.n, L = LEVELS[Game.lv]; b.innerHTML = ''; this.els = {};
    for (let i = 0; i < n * n; i++) { if (!SHAPES[L.shape](i % n, Math.floor(i / n), n)) continue; const c = document.createElement('div'); c.className = 'cell'; c.dataset.c = i; b.appendChild(c); }
    Game.grid.forEach((d, i) => { if (d < 0) return; const e = document.createElement('div'); e.className = 'arr'; e.dataset.i = i; e.innerHTML = `<div class="bg"></div>${ARROW}`; e.querySelector('svg').style.transform = `rotate(${d * 90}deg)`; e.onclick = () => Game.tap(i); b.appendChild(e); this.els[i] = e; });
    // posiciona sem animação; a transição só vale para a saída das setas
    Object.values(this.els).forEach(e => e.style.transition = 'none');
    this.size();
    requestAnimationFrame(() => requestAnimationFrame(() => Object.values(this.els).forEach(e => e.style.transition = '')));
  },
  layout() { const n = Game.n, a = this.a; HX.$('#board').querySelectorAll('[data-c],[data-i]').forEach(e => { const i = +(e.dataset.c ?? e.dataset.i); if (!e.classList.contains('gone')) e.style.transform = `translate(${(i % n) * a}px,${Math.floor(i / n) * a}px)`; }); },
  fly(i, d) { const e = this.els[i], n = Game.n, a = this.a, far = a * (n + 2); e.classList.add('gone'); e.style.transform = `translate(${(i % n) * a + D[d][0] * far}px,${Math.floor(i / n) * a + D[d][1] * far}px)`; setTimeout(() => e.remove(), 500); },
  bump(i, d) { const e = this.els[i]; e.style.setProperty('--bx', D[d][0] * this.a * .25 + 'px'); e.style.setProperty('--by', D[d][1] * this.a * .25 + 'px'); e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); },
  hint(i) { const e = this.els[i]; e.classList.add('hint'); setTimeout(() => e.classList.remove('hint'), 1600); }
};

/* ---------- UI ---------- */
const UI = {
  init() {
    HX.$('#t-reset').onclick = () => Game.start(Game.lv); HX.$('#t-hint').onclick = () => Game.hint(); HX.$('#t-levels').onclick = () => this.levels(); HX.$('#menu').onclick = () => this.levels();
    new ResizeObserver(() => Game.grid && View.size()).observe(HX.$('#stage')); HX.life({ onHide: () => Game.timer.stop(), onShow: () => { if (Game.grid && !Game.done && Game.moves) Game.timer.start(() => this.hud()); } });
    Game.start(S.get('progress', { unlocked: 0 }).unlocked); this.levels();
  },
  hud() { HX.$('#lv').textContent = Game.lv + 1; HX.$('#hearts').textContent = '♥'.repeat(Math.max(0, Game.hearts)) + '♡'.repeat(3 - Math.max(0, Game.hearts)); HX.$('#left').textContent = Game.grid.filter(v => v >= 0).length; HX.$('#time').textContent = HX.fmt(Game.timer.ms); HX.$('#b-hint').textContent = Game.hints; },
  levels() {
    const p = S.get('progress', { unlocked: 0, levels: {} });
    const c = HX.overlay(`<h3>Arrow</h3><p>Toque nas setas para tirá-las do tabuleiro. Cada uma só sai se o caminho na direção dela estiver livre.</p><div class="lvwrap"><div class="levels">${LEVELS.map((L, k) => { const d = p.levels[k]; return `<button class="lvb ${k > p.unlocked ? 'locked' : ''} ${k === p.unlocked ? 'next' : ''}" data-k="${k}">${k + 1}<small>${d ? '★'.repeat(d.stars) + '☆'.repeat(3 - d.stars) : k > p.unlocked ? '🔒' : L.n + '×' + L.n}</small></button>`; }).join('')}</div></div><button class="btn-primary" id="go">Jogar fase ${p.unlocked + 1}</button><button class="btn" id="how">Como jogar</button>`, { guard: false });
    c.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = +b.dataset.k; if (k > p.unlocked) return HX.toast('Conclua a fase anterior'); Game.start(k); });
    HX.on(c, '#go', () => Game.start(p.unlocked)); HX.on(c, '#how', () => HX.help('Como jogar', ['Toque numa seta. Ela sai voando na direção para onde aponta, se não houver outra seta no caminho até a borda.', 'Se o caminho estiver bloqueado, ela bate e você perde uma vida (♥). Com 3 batidas a fase é perdida.', 'Descubra a ordem certa: às vezes é preciso tirar outras setas primeiro.', 'Concluir sem bater vale ★★★. Cada fase tem 3 dicas.'], () => this.levels()));
  },
  win(stars) { const last = Game.lv + 1 >= LEVELS.length; const c = HX.overlay(`<h3>Tabuleiro limpo!</h3><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div><div class="kv"><div><b>${HX.fmt(Game.timer.ms)}</b><small>Tempo</small></div><div><b>${3 - Game.hearts}</b><small>Batidas</small></div><div><b>${Game.lv + 1}</b><small>Fase</small></div></div>${last ? '<p>Você concluiu todas as fases!</p>' : '<button class="btn-primary" id="nx">Próxima fase</button>'}<div class="row2"><button class="btn" id="rp">Repetir</button><button class="btn" id="lv">Fases</button></div>`);
    HX.on(c, '#nx', () => Game.start(Game.lv + 1)); HX.on(c, '#rp', () => Game.start(Game.lv)); HX.on(c, '#lv', () => this.levels()); },
  lose() { const c = HX.overlay(`<h3>Sem vidas</h3><p>Três setas bateram. Observe os caminhos e tente outra ordem.</p><button class="btn-primary" id="rp">Tentar de novo</button><button class="btn" id="lv">Fases</button>`); HX.on(c, '#rp', () => Game.start(Game.lv)); HX.on(c, '#lv', () => this.levels()); }
};
UI.init(); HX.sw();
window.AR = { LEVELS, Gen, Rules, Game, View, S, SHAPES };
</script>
</body>
</html>
